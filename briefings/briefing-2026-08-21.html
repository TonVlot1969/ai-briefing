*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);

header{text-align:center;margin-bottom:14px}
header h1{font-size:22px;margin:0 0 4px}
header p{font-size:14px;color:var(--muted);margin:0}
.bar{display:flex;gap:10px;margin:14px 0 10px}
.langs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px}
.langs button{flex:1;border:none;background:transparent;color:var(--muted);font-size:15px;font-weight:700;

.langs button.on{background:linear-gradient(135deg,var(--cyan),var(--violet));color:var(--ink)}
select{flex:1;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;font-size:15px;font-family:inherit;-webkit-appearance:none;appearance:none;cursor:pointer}
.controls{display:flex;gap:12px;margin:12px 0 16px}
.controls button{flex:1;border-radius:18px;font-size:19px;font-weight:700;padding:26px 8px;cursor:pointer;
  font-family:inherit;border:1px solid transparent;background:var(--surface);color:var(--text)}
#play{flex:1.6;border:none;color:var(--ink);
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  box-shadow:0 0 22px rgba(62,233,240,.28), 0 0 34px rgba(168,85,247,.22)}
#pause{border-color:var(--violet);color:#cfa8ff}
#stop{border-color:var(--magenta);color:#f0a2ff}
.big{font-size:23px}
.status{text-align:center;font-size:14px;color:var(--muted);margin-bottom:14px;min-height:18px}
.script{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 18px 8px;
  font-size:17px;line-height:1.6}
.script p{margin:0 0 14px;transition:color .2s}
.script p.lead{color:var(--cyan);font-weight:600}
.script p.speaking{background:var(--surface2);border-radius:8px;box-shadow:0 0 0 8px var(--surface2),inset 0 0 0 1px rgba(168,85,247,.35)}
.sources{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.sources a{color:var(--link);word-break:break-word}
.hint{text-align:center;font-size:12px;color:var(--faint);margin-top:20px}

}

function buildSelect(){
  elSel.innerHTML = '';
  DATA.forEach(function(b, i){
    var o = document.createElement('option');
    o.value = i; o.textContent = b.label[lang] + ' · ' + b.summary[lang];
    elSel.appendChild(o);
  });
  elSel.value = current;
}

function render(){
  var b = DATA[current], part = b[lang];
  elStamp.textContent = b.label[lang];
  document.documentElement.lang = lang;
  elScript.innerHTML = '';
  part.paras.forEach(function(p, i){
    var el = document.createElement('p');
    if(i === 0) el.className = 'lead';
    el.textContent = p.t;
    el.setAttribute('data-speak', p.s);
    elScript.appendChild(el);
  });
  var src = document.createElement('div');
  src.className = 'sources';
  src.appendChild(document.createTextNode(T[lang].sources));
  part.sources.forEach(function(s, i){
    if(i) src.appendChild(document.createTextNode(' · '));
    var a = document.createElement('a');
    a.href = s.u; a.target = '_blank'; a.rel = 'noopener'; a.textContent = s.t;
    src.appendChild(a);
  });
  elScript.appendChild(src);
  elHint.textContent = T[lang].hint;
  btnPlay.textContent = T[lang].play;
  elStatus.textContent = T[lang].tap;
  buildSelect();
}

function clearHighlight(){
  [].forEach.call(elScript.querySelectorAll('p'), function(p){ p.classList.remove('speaking'); });
}

function speak(){
  if(!('speechSynthesis' in window)){ elStatus.textContent = T[lang].novoice; return; }
  synth.cancel(); clearHighlight();
  var voice = pickVoice(lang);
  var nodes = [].slice.call(elScript.querySelectorAll('[data-speak]'));
  if(!nodes.length) return;
  nodes.forEach(function(node, i){
    var u = new SpeechSynthesisUtterance(node.getAttribute('data-speak'));
    if(voice) u.voice = voice;
    u.lang = voice ? voice.lang : (lang === 'nl' ? 'nl-NL' : 'en-GB');
    u.rate = 1.0; u.pitch = 1.0;
    u.onstart = function(){
      clearHighlight(); node.classList.add('speaking');
      elStatus.textContent = T[lang].playing; btnPlay.textContent = T[lang].playingBtn;
    };
    if(i === nodes.length - 1){
      u.onend = function(){ clearHighlight(); elStatus.textContent = T[lang].done;
        btnPlay.textContent = T[lang].play; paused = false; };
    }
    u.onerror = function(){ clearHighlight(); elStatus.textContent = T[lang].stopped;
      btnPlay.textContent = T[lang].play; };
    synth.speak(u);
  });
  paused = false;
}

function setLang(l){
  if(l === lang) return;
  lang = l;
  try{ localStorage.setItem('aibriefing-lang', l); }catch(e){}
  btnNL.className = l === 'nl' ? 'on' : '';
  btnEN.className = l === 'en' ? 'on' : '';
  synth.cancel(); paused = false;
  render();
}

btnNL.addEventListener('click', function(){ setLang('nl'); });
btnEN.addEventListener('click', function(){ setLang('en'); });
elSel.addEventListener('change', function(){
  current = parseInt(elSel.value, 10) || 0;
  synth.cancel(); paused = false; render();
});
btnPlay.addEventListener('click', function(){
  if(paused){ synth.resume(); paused = false; elStatus.textContent = T[lang].playing; return; }
  speak();
});
btnPause.addEventListener('click', function(){
  if(synth.speaking && !paused){ synth.pause(); paused = true; elStatus.textContent = T[lang].paused; }
});
btnStop.addEventListener('click', function(){
  synth.cancel(); paused = false; clearHighlight();
  elStatus.textContent = T[lang].stopped; btnPlay.textContent = T[lang].play;
});
window.addEventListener('beforeunload', function(){ synth.cancel(); });

btnNL.className = lang === 'nl' ? 'on' : '';
btnEN.className = lang === 'en' ? 'on' : '';
render();
})();
</script></body></html>
