<style>
:root{
  --bg:#080d20; --surface:#101a33; --surface2:#1a2647; --border:#26355e;
  --text:#e6f3ff; --muted:#93a4c8; --faint:#6a7aa3;
  --cyan:#3ee9f0; --violet:#a855f7; --magenta:#d14ce8; --ink:#08122c; --link:#5ee7f5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;min-height:100vh;padding:20px 16px 40px;max-width:760px;margin:0 auto}
header{text-align:center;margin-bottom:12px}
header h1{font-size:21px;margin:0 0 4px}
header p{font-size:14px;color:var(--muted);margin:0}
.bar{display:flex;gap:10px;margin:12px 0 10px}
.langs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px}
.langs button{border:none;background:transparent;color:var(--muted);font-size:15px;font-weight:700;
  padding:10px 16px;border-radius:9px;cursor:pointer;font-family:inherit}
.langs button.on{background:linear-gradient(135deg,var(--cyan),var(--violet));color:var(--ink)}
select{flex:1;min-width:0;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;font-size:15px;font-family:inherit;-webkit-appearance:none;appearance:none;cursor:pointer}
.picker{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.picker h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface2);
  color:var(--muted);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;user-select:none;font-weight:600}
.chip.on{border-color:var(--cyan);color:var(--text);box-shadow:0 0 0 1px var(--cyan) inset}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.chip.on .dot{background:linear-gradient(135deg,var(--cyan),var(--violet))}
.chip.fixed{cursor:default;border-color:var(--violet);color:var(--text)}
.chip.fixed .dot{background:var(--violet)}
.pickfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--faint)}
.pickfoot button{background:none;border:none;color:var(--link);font-size:12px;font-family:inherit;cursor:pointer;padding:0}
.controls{display:flex;gap:9px;margin:4px 0 10px;align-items:stretch}
.controls button{border-radius:16px;font-size:17px;font-weight:700;padding:20px 4px;cursor:pointer;
  font-family:inherit;border:1px solid transparent;background:var(--surface);color:var(--text);flex:1}
#play{flex:2;border:none;color:var(--ink);font-size:19px;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  box-shadow:0 0 22px rgba(62,233,240,.28), 0 0 34px rgba(168,85,247,.22)}
#back10,#fwd10{border-color:var(--cyan);color:var(--cyan);font-size:15px;line-height:1.25}
#back10 small,#fwd10 small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.controls2{display:flex;gap:9px;margin:0 0 12px}
.controls2 button{flex:1;border-radius:14px;font-size:15px;font-weight:700;padding:13px 4px;cursor:pointer;
  font-family:inherit;background:var(--surface);color:var(--text);border:1px solid var(--border)}
#pause{border-color:var(--violet);color:#cfa8ff}
#stop{border-color:var(--magenta);color:#f0a2ff}
button:disabled{opacity:.4;cursor:default}
.progwrap{margin:2px 0 10px}
.prog{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden;cursor:pointer}
.prog span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .25s linear}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:5px;font-variant-numeric:tabular-nums}
.status{text-align:center;font-size:14px;color:var(--muted);margin-bottom:12px;min-height:18px}
.script{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px 8px;
  font-size:17px;line-height:1.6}
.script h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--cyan);
  margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--border);font-weight:800}
.script h3:first-child{margin-top:2px;padding-top:0;border-top:none}
.script p{margin:0 0 14px;transition:color .2s}
.script p.speaking{background:var(--surface2);border-radius:8px;box-shadow:0 0 0 8px var(--surface2),inset 0 0 0 1px rgba(168,85,247,.35)}
.sources{margin:2px 0 6px;padding-top:12px;border-top:1px dashed var(--border);font-size:13px;color:var(--muted)}
.sources a{color:var(--link);word-break:break-word}
.hint{text-align:center;font-size:12px;color:var(--faint);margin-top:20px}
.hint a{color:var(--link)}
</style></head>

<script id="data" type="application/json">
{"briefings":[{"date":"2026-08-28","label":{"en":"28 August 2026","nl":"28 augustus 2026"},"summary":{"en":"Genie opens up, EU transparency rules bite","nl":"Genie gaat open, EU transparantieregels gelden"},"sections":[{"id":"generic","title":{"en":"General AI news","nl":"Algemeen AI nieuws"},"en":{"paras":[{"t":"Good morning. This is your weekly AI briefing for the EPAM Data community. The general news comes first, then a block for each of our five roles. Pick the ones you need and skip the rest.","s":"Good morning. This is your weekly A I briefing for the Epam Data community. The general news comes first, then a block for each of our five roles. Pick the ones you need and skip the rest."},{"t":"On models, the pace has settled into something predictable. Gemini 3.7 Flash arrived on 13 August as the fastest frontier class model on the market. Claude Opus 5 has been the default in Claude Code since late July and turned up in Snowflake Cortex AI in public preview this month. GPT-5.6 Sol has been generally available since July. The useful takeaway is not which one wins. It is that model choice has become a routing decision you make per task, not a standard you pick once a year.","s":"On models, the pace has settled into something predictable. Gemini three point seven Flash arrived on the thirteenth of August as the fastest frontier class model on the market. Claude Opus five has been the default in Claude Code since late July and turned up in Snowflake Cortex A I in public preview this month. G P T five point six Sol has been generally available since July. The useful takeaway is not which one wins. It is that model choice has become a routing decision you make per task, not a standard you pick once a year."},{"t":"Second, a date that matters for all of us. Since 2 August the transparency obligations of the EU AI Act are in force and enforceable by national authorities. If a system talks to users, generates text, images, audio or video, or reads emotions or biometrics, you have to disclose it and label the output. That applies whether or not the system is high risk. The heavier high risk obligations were pushed back to December 2027 by the AI Omnibus, and watermarking moved to December this year. The paperwork got more time. The disclosure did not.","s":"Second, a date that matters for all of us. Since the second of August the transparency obligations of the E U A I Act are in force and enforceable by national authorities. If a system talks to users, generates text, images, audio or video, or reads emotions or biometrics, you have to disclose it and label the output. That applies whether or not the system is high risk. The heavier high risk obligations were pushed back to December twenty twenty seven by the A I Omnibus, and watermarking moved to December this year. The paperwork got more time. The disclosure did not."},{"t":"Third, a reality check on agents. VentureBeat surveyed 573 people at enterprises this summer. One in five cannot stop a runaway agent's spending in real time. A quarter have already been hit by an infinite loop bill. And 49 percent name shadow AI, agent pipelines running on someone's corporate card outside central oversight, as their most severe control failure. Worth knowing before you promise a client an autonomous anything.","s":"Third, a reality check on agents. VentureBeat surveyed five hundred and seventy three people at enterprises this summer. One in five cannot stop a runaway agent's spending in real time. A quarter have already been hit by an infinite loop bill. And 49 percent name shadow A I, agent pipelines running on someone's corporate card outside central oversight, as their most severe control failure. Worth knowing before you promise a client an autonomous anything."}],"sources":[{"t":"EU AI Act transparency obligations now in force (Goodwin, August 2026)","u":"https://www.goodwinlaw.com/en/insights/publications/2026/08/alerts-technology-dpc-eu-ai-act-transparency-obligations-now-in-force"},{"t":"Transparency rules, Article 50 (EU AI Act)","u":"https://artificialintelligenceact.eu/transparency-rules-article-50/"},{"t":"VentureBeat Research: where enterprise AI agent governance hasn't caught up","u":"https://venturebeat.com/technology/venturebeat-research-where-enterprise-ai-agent-governance-hasnt-caught-up"},{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"}]},"nl":{"paras":[{"t":"Goedemorgen. Dit is je wekelijkse AI briefing voor de EPAM Data community. Eerst het algemene nieuws, daarna een blok per functie. Vink aan wat je nodig hebt, de rest sla je gewoon over.","s":"Goedemorgen. Dit is je wekelijkse A I briefing voor de Epam Data community. Eerst het algemene nieuws, daarna een blok per functie. Vink aan wat je nodig hebt, de rest sla je gewoon over."},{"t":"Even over de modellen. Het tempo is inmiddels voorspelbaar. Gemini 3.7 Flash kwam op 13 augustus uit en is nu het snelste model in de topklasse. Claude Opus 5 is sinds eind juli de standaard in Claude Code en zit deze maand ook in Snowflake Cortex AI, in public preview. GPT-5.6 Sol is er al sinds juli. Wie er wint is niet zo interessant. Wat wel telt is dat je tegenwoordig per taak een model kiest, in plaats van een keer per jaar een standaard vast te leggen.","s":"Even over de modellen. Het tempo is inmiddels voorspelbaar. Gemini drie punt zeven Flash kwam op dertien augustus uit en is nu het snelste model in de topklasse. Claude Opus vijf is sinds eind juli de standaard in Claude Code en zit deze maand ook in Snowflake Cortex A I, in public preview. G P T vijf punt zes Sol is er al sinds juli. Wie er wint is niet zo interessant. Wat wel telt is dat je tegenwoordig per taak een model kiest, in plaats van een keer per jaar een standaard vast te leggen."},{"t":"Dan iets dat voor ons allemaal geldt. Sinds 2 augustus zijn de transparantieregels van de EU AI Act van kracht, en kunnen toezichthouders er ook op handhaven. Praat een systeem met gebruikers, of maakt het tekst, beeld, audio of video, of leest het emoties of biometrie af? Dan moet je dat melden en de output labelen. Of het systeem hoog risico is of niet maakt daarbij niet uit. De zwaardere eisen voor hoog risico zijn met de AI Omnibus doorgeschoven naar december 2027, en watermerken naar december dit jaar. Het papierwerk kreeg dus uitstel, de transparantie niet.","s":"Dan iets dat voor ons allemaal geldt. Sinds twee augustus zijn de transparantieregels van de E U A I Act van kracht, en kunnen toezichthouders er ook op handhaven. Praat een systeem met gebruikers, of maakt het tekst, beeld, audio of video, of leest het emoties of biometrie af? Dan moet je dat melden en de output labelen. Of het systeem hoog risico is of niet maakt daarbij niet uit. De zwaardere eisen voor hoog risico zijn met de A I Omnibus doorgeschoven naar december tweeduizend zevenentwintig, en watermerken naar december dit jaar. Het papierwerk kreeg dus uitstel, de transparantie niet."},{"t":"En dan een realitycheck over agents. VentureBeat sprak deze zomer 573 mensen bij grote bedrijven. Een op de vijf kan een agent die op hol slaat niet in real time stoppen. Een kwart heeft al eens een rekening gehad van een oneindige lus. En 49 procent noemt shadow AI hun grootste probleem, dus agents die buiten het zicht op iemands bedrijfspas draaien. Goed om te weten voordat je een klant iets autonooms belooft.","s":"En dan een realitycheck over agents. VentureBeat sprak deze zomer vijfhonderddrieënzeventig mensen bij grote bedrijven. Een op de vijf kan een agent die op hol slaat niet in real time stoppen. Een kwart heeft al eens een rekening gehad van een oneindige lus. En 49 procent noemt shadow A I hun grootste probleem, dus agents die buiten het zicht op iemands bedrijfspas draaien. Goed om te weten voordat je een klant iets autonooms belooft."}],"sources":[{"t":"EU AI Act transparency obligations now in force (Goodwin, August 2026)","u":"https://www.goodwinlaw.com/en/insights/publications/2026/08/alerts-technology-dpc-eu-ai-act-transparency-obligations-now-in-force"},{"t":"Transparency rules, Article 50 (EU AI Act)","u":"https://artificialintelligenceact.eu/transparency-rules-article-50/"},{"t":"VentureBeat Research: where enterprise AI agent governance hasn't caught up","u":"https://venturebeat.com/technology/venturebeat-research-where-enterprise-ai-agent-governance-hasnt-caught-up"},{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"}]}},{"id":"governance","title":{"en":"Data Governance","nl":"Data Governance"},"en":{"paras":[{"t":"For the Data Governance people, the AI Act is your headline. Article 50 is the operative bit. Disclose when a user is interacting with AI, label synthetic content, and identify deepfakes. The practical translation is that your client's chatbot and any generated asset need a disclosure now, and somebody has to own it. The conformity work for high risk systems has until December 2027, which is time to prepare, not time to ignore.","s":"For the Data Governance people, the A I Act is your headline. Article fifty is the operative bit. Disclose when a user is interacting with A I, label synthetic content, and identify deepfakes. The practical translation is that your client's chatbot and any generated asset need a disclosure now, and somebody has to own it. The conformity work for high risk systems has until December twenty twenty seven, which is time to prepare, not time to ignore."},{"t":"On the platform side, Databricks made Secrets in Unity Catalog generally available. Secrets become securable objects in the three level namespace with the same privileges and audit trail as everything else. More interesting for audits, INSERT, UPDATE and DELETE privileges are now in beta as least privilege alternatives to MODIFY. You can finally grant write access to a table's data without also handing over the right to change its schema. If you have ever written that finding into a report, this is the fix."},{"t":"And Unity Catalog now registers models, MCP services, agents and skills next to your tables, with the same access controls, lineage and auditing. Microsoft is moving the same way, pushing Purview from policy documents toward runtime enforcement. Governance is quietly becoming something you execute rather than something you publish.","s":"And Unity Catalog now registers models, M C P services, agents and skills next to your tables, with the same access controls, lineage and auditing. Microsoft is moving the same way, pushing Purview from policy documents toward runtime enforcement. Governance is quietly becoming something you execute rather than something you publish."}],"sources":[{"t":"Databricks release notes, August 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/august"},{"t":"What's new with Unity Catalog (Databricks)","u":"https://www.databricks.com/blog/whats-new-unity-catalog-data-ai-summit-2026"},{"t":"Microsoft moves AI governance from policy to runtime enforcement (InfoQ)","u":"https://www.infoq.com/news/2026/08/microsoft-ai-governance/"},{"t":"EU AI Act transparency obligations now in force (Goodwin)","u":"https://www.goodwinlaw.com/en/insights/publications/2026/08/alerts-technology-dpc-eu-ai-act-transparency-obligations-now-in-force"}]},"nl":{"paras":[{"t":"Voor iedereen in Data Governance is de AI Act het belangrijkste nieuws. Artikel 50 is het stuk waar het om draait. Melden dat iemand met AI praat, synthetische content labelen, en deepfakes herkenbaar maken. Concreet betekent het dat de chatbot van je klant en elk gegenereerd bestand nu een melding nodig hebben, en dat iemand daar eigenaar van moet zijn. Voor het conformiteitswerk rond hoog risico heb je tot december 2027. Dat is tijd om je voor te bereiden, niet om het te laten liggen.","s":"Voor iedereen in Data Governance is de A I Act het belangrijkste nieuws. Artikel 50 is het stuk waar het om draait. Melden dat iemand met A I praat, synthetische content labelen, en deepfakes herkenbaar maken. Concreet betekent het dat de chatbot van je klant en elk gegenereerd bestand nu een melding nodig hebben, en dat iemand daar eigenaar van moet zijn. Voor het conformiteitswerk rond hoog risico heb je tot december tweeduizend zevenentwintig. Dat is tijd om je voor te bereiden, niet om het te laten liggen."},{"t":"Aan de platformkant maakte Databricks Secrets in Unity Catalog algemeen beschikbaar. Secrets zijn nu gewone securable objects in de drielaagse namespace, met dezelfde rechten en hetzelfde audit spoor als de rest. Interessanter voor audits zijn de nieuwe rechten INSERT, UPDATE en DELETE, in beta, als lichtere variant op MODIFY. Je kunt eindelijk iemand in de data van een tabel laten schrijven zonder hem ook het schema te laten wijzigen. Heb je die bevinding ooit in een rapport gezet? Dit is de oplossing."},{"t":"En Unity Catalog registreert nu ook modellen, MCP services, agents en skills, gewoon naast je tabellen, met dezelfde rechten, lineage en auditing. Microsoft gaat dezelfde kant op en verschuift Purview van beleidsdocumenten naar handhaving op het moment zelf. Governance wordt zo iets dat je uitvoert, in plaats van iets dat je publiceert.","s":"En Unity Catalog registreert nu ook modellen, M C P services, agents en skills, gewoon naast je tabellen, met dezelfde rechten, lineage en auditing. Microsoft gaat dezelfde kant op en verschuift Purview van beleidsdocumenten naar handhaving op het moment zelf. Governance wordt zo iets dat je uitvoert, in plaats van iets dat je publiceert."}],"sources":[{"t":"Databricks release notes, August 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/august"},{"t":"What's new with Unity Catalog (Databricks)","u":"https://www.databricks.com/blog/whats-new-unity-catalog-data-ai-summit-2026"},{"t":"Microsoft moves AI governance from policy to runtime enforcement (InfoQ)","u":"https://www.infoq.com/news/2026/08/microsoft-ai-governance/"},{"t":"EU AI Act transparency obligations now in force (Goodwin)","u":"https://www.goodwinlaw.com/en/insights/publications/2026/08/alerts-technology-dpc-eu-ai-act-transparency-obligations-now-in-force"}]}},{"id":"engineering","title":{"en":"Data Engineers","nl":"Data Engineers"},"en":{"paras":[{"t":"Data Engineers. Microsoft Fabric shipped a solid August. The Native Execution Engine now handles complex types, arrays, maps and structs, and runs Python and Scala UDFs natively. Queries over nested data stay in the native engine instead of falling back, so you keep Z-ORDER and Liquid Clustering, and the serialisation overhead on user defined functions goes away.","s":"Data Engineers. Microsoft Fabric shipped a solid August. The Native Execution Engine now handles complex types, arrays, maps and structs, and runs Python and Scala U D F's natively. Queries over nested data stay in the native engine instead of falling back, so you keep Z order and Liquid Clustering, and the serialisation overhead on user defined functions goes away."},{"t":"Two more from Fabric. Copy Job now does watermark based incremental loading, including from SaaS sources like Salesforce, and it can create Lakehouse tables with Change Data Feed already switched on, so a lot of hand written CDC glue disappears. And Efficient Scaledown offloads shuffle data to Blob storage through a Remote Shuffle Manager, so executors are actually released when a job winds down instead of being pinned by shuffle files. If you pay for capacity that is doing nothing, that is real money."},{"t":"On Snowflake, the Openflow connector for SQL Server change data capture went generally available on 5 August, and the Cortex Agent code execution tool went to preview on 20 August. On Databricks, session restore for serverless jobs is in beta. When a job fails, is cancelled, or runs past thirty minutes, it snapshots the Python variables and the Spark session so you can pull that state into a notebook, instead of rerunning a two hour pipeline just to find out what broke.","s":"On Snowflake, the Openflow connector for S Q L Server change data capture went generally available on the fifth of August, and the Cortex Agent code execution tool went to preview on the twentieth of August. On Databricks, session restore for serverless jobs is in beta. When a job fails, is cancelled, or runs past thirty minutes, it snapshots the Python variables and the Spark session so you can pull that state into a notebook, instead of rerunning a two hour pipeline just to find out what broke."}],"sources":[{"t":"Fabric August 2026 Feature Summary","u":"https://community.fabric.microsoft.com/blog/fbc_fabricupdatesblogs/fabric-august-2026-feature-summary/5325824"},{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"},{"t":"Databricks release notes, August 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/august"}]},"nl":{"paras":[{"t":"Data Engineers, Microsoft Fabric had een goede augustus. De Native Execution Engine kan nu overweg met complexe types, dus arrays, maps en structs, en draait Python en Scala UDF's native. Queries over geneste data blijven daardoor in de native engine in plaats van terug te vallen. Je houdt dus Z-ORDER en Liquid Clustering, en de serialisatie overhead op user defined functions verdwijnt.","s":"Data Engineers, Microsoft Fabric had een goede augustus. De Native Execution Engine kan nu overweg met complexe types, dus arrays, maps en structs, en draait Python en Scala U D F's native. Queries over geneste data blijven daardoor in de native engine in plaats van terug te vallen. Je houdt dus Z order en Liquid Clustering, en de serialisatie overhead op user defined functions verdwijnt."},{"t":"Nog twee dingen uit Fabric. Copy Job laadt nu incrementeel op basis van een watermerk, ook vanuit SaaS bronnen zoals Salesforce, en kan Lakehouse tabellen aanmaken met Change Data Feed al aan. Dat scheelt een hoop zelfgebouwd CDC lijmwerk. En met Efficient Scaledown gaat shuffle data via een Remote Shuffle Manager naar Blob storage, zodat executors echt vrijkomen als een job afbouwt. Betaal je voor capaciteit die niets staat te doen, dan scheelt dat direct geld."},{"t":"Bij Snowflake werd de Openflow connector voor SQL Server change data capture op 5 augustus algemeen beschikbaar, en de Cortex Agent code execution tool ging op 20 augustus naar preview. Bij Databricks staat session restore voor serverless jobs in beta. Faalt een job, wordt hij geannuleerd, of duurt hij langer dan een half uur, dan bewaart Databricks je Python variabelen en de Spark sessie, zodat je die toestand zo in een notebook binnenhaalt. Geen pipeline van twee uur meer opnieuw draaien om te zien wat er misging.","s":"Bij Snowflake werd de Openflow connector voor S Q L Server change data capture op vijf augustus algemeen beschikbaar, en de Cortex Agent code execution tool ging op twintig augustus naar preview. Bij Databricks staat session restore voor serverless jobs in beta. Faalt een job, wordt hij geannuleerd, of duurt hij langer dan een half uur, dan bewaart Databricks je Python variabelen en de Spark sessie, zodat je die toestand zo in een notebook binnenhaalt. Geen pipeline van twee uur meer opnieuw draaien om te zien wat er misging."}],"sources":[{"t":"Fabric August 2026 Feature Summary","u":"https://community.fabric.microsoft.com/blog/fbc_fabricupdatesblogs/fabric-august-2026-feature-summary/5325824"},{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"},{"t":"Databricks release notes, August 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/august"}]}},{"id":"bi","title":{"en":"BI Consultants","nl":"BI Consultants"},"en":{"paras":[{"t":"BI Consultants, this is your week. Snowflake made Power BI ingestion for Semantic View Autopilot generally available on 18 August. You upload a .pbit or .pbix file and it builds a semantic view from your existing model, keeping the DAX measures, the table relationships and the column descriptions you already wrote, and hands the result to Cortex Analyst. Years of modelling work becomes agent ready in one upload.","s":"B I Consultants, this is your week. Snowflake made Power B I ingestion for Semantic View Autopilot generally available on the eighteenth of August. You upload a dot p b i t or dot p b i x file and it builds a semantic view from your existing model, keeping the Dax measures, the table relationships and the column descriptions you already wrote, and hands the result to Cortex Analyst. Years of modelling work becomes agent ready in one upload."},{"t":"Databricks did the mirror image on 20 August. Genie Code can import Power BI and Tableau reports with the importBI command, now generally available. Both vendors have worked out that the semantic model is the moat, and both of them want to import yours.","s":"Databricks did the mirror image on the twentieth of August. Genie Code can import Power B I and Tableau reports with the import B I command, now generally available. Both vendors have worked out that the semantic model is the moat, and both of them want to import yours."},{"t":"In Fabric, data agents got advanced DAX generation on the preview runtime. Instead of writing one query in one pass, it reasons across steps and looks up the real values in your columns before it builds a filter, which is where most wrong answers were coming from. And in the August Power BI release, Copilot summaries and the narrative visual can now read visuals that are hidden behind a bookmark, and the Theme pane went generally available.","s":"In Fabric, data agents got advanced Dax generation on the preview runtime. Instead of writing one query in one pass, it reasons across steps and looks up the real values in your columns before it builds a filter, which is where most wrong answers were coming from. And in the August Power B I release, Copilot summaries and the narrative visual can now read visuals that are hidden behind a bookmark, and the Theme pane went generally available."}],"sources":[{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"},{"t":"Databricks AI/BI and Genie One release notes 2026","u":"https://docs.databricks.com/aws/en/ai-bi/release-notes/2026"},{"t":"Fabric data agent runtime (Microsoft Learn)","u":"https://learn.microsoft.com/en-us/fabric/data-science/data-agent-runtime"},{"t":"Power BI August 2026 Feature Summary","u":"https://community.fabric.microsoft.com/blog/fbc_pbiupdatesblog/power-bi-august-2026-feature-summary/5348434"}]},"nl":{"paras":[{"t":"BI Consultants, dit is jullie week. Snowflake maakte op 18 augustus de Power BI import voor Semantic View Autopilot algemeen beschikbaar. Je uploadt een .pbit of .pbix bestand, en er rolt een semantic view uit je bestaande model, inclusief je DAX measures, je tabelrelaties en de kolomomschrijvingen die je al had. Cortex Analyst kan er daarna meteen mee werken. Jaren modelleerwerk staat zo met een upload klaar voor agents.","s":"B I Consultants, dit is jullie week. Snowflake maakte op achttien augustus de Power B I import voor Semantic View Autopilot algemeen beschikbaar. Je uploadt een dot p b i t of dot p b i x bestand, en er rolt een semantic view uit je bestaande model, inclusief je Dax measures, je tabelrelaties en de kolomomschrijvingen die je al had. Cortex Analyst kan er daarna meteen mee werken. Jaren modelleerwerk staat zo met een upload klaar voor agents."},{"t":"Databricks deed op 20 augustus precies het spiegelbeeld. Genie Code importeert nu Power BI en Tableau rapporten met het importBI commando, algemeen beschikbaar. Allebei de leveranciers hebben door dat het semantische model de echte waarde is, en allebei willen ze die van jou binnenhalen.","s":"Databricks deed op twintig augustus precies het spiegelbeeld. Genie Code importeert nu Power B I en Tableau rapporten met het import B I commando, algemeen beschikbaar. Allebei de leveranciers hebben door dat het semantische model de echte waarde is, en allebei willen ze die van jou binnenhalen."},{"t":"In Fabric kregen de data agents geavanceerde DAX generatie op de preview runtime. In plaats van in een keer een query schrijven, redeneert het nu in stappen, en zoekt het eerst de echte waarden in je kolommen op voordat het een filter bouwt. Daar ging het bij de meeste foute antwoorden mis. En in de Power BI release van augustus lezen Copilot samenvattingen en de narrative visual ook visuals die achter een bookmark verstopt zitten. Het Theme paneel werd algemeen beschikbaar.","s":"In Fabric kregen de data agents geavanceerde Dax generatie op de preview runtime. In plaats van in een keer een query schrijven, redeneert het nu in stappen, en zoekt het eerst de echte waarden in je kolommen op voordat het een filter bouwt. Daar ging het bij de meeste foute antwoorden mis. En in de Power B I release van augustus lezen Copilot samenvattingen en de narrative visual ook visuals die achter een bookmark verstopt zitten. Het Theme paneel werd algemeen beschikbaar."}],"sources":[{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"},{"t":"Databricks AI/BI and Genie One release notes 2026","u":"https://docs.databricks.com/aws/en/ai-bi/release-notes/2026"},{"t":"Fabric data agent runtime (Microsoft Learn)","u":"https://learn.microsoft.com/en-us/fabric/data-science/data-agent-runtime"},{"t":"Power BI August 2026 Feature Summary","u":"https://community.fabric.microsoft.com/blog/fbc_pbiupdatesblog/power-bi-august-2026-feature-summary/5348434"}]}},{"id":"architecture","title":{"en":"Data Architects","nl":"Data Architects"},"en":{"paras":[{"t":"Data Architects. Watch the namespace. The Unity Catalog four level address, metastore, catalog, schema, table, now covers models, MCP services, agents and skills as well as data, with one set of access policies, one audit trail and column level lineage end to end. Your catalog is turning into the agent registry, whether you planned that or not.","s":"Data Architects. Watch the namespace. The Unity Catalog four level address, metastore, catalog, schema, table, now covers models, M C P services, agents and skills as well as data, with one set of access policies, one audit trail and column level lineage end to end. Your catalog is turning into the agent registry, whether you planned that or not."},{"t":"Same pattern at Snowflake. Since 7 August a provider can ship a Snowflake managed MCP server inside a Native App that exposes Cortex Search services, semantic views, stored procedures and UDFs as tools any agent can call. Databricks has the Genie One managed MCP server in beta doing the equivalent. Two competitors, one conclusion. MCP is becoming the contract between agents and the data platform, so decide deliberately whether you standardise on it, because otherwise you will standardise on it by accident.","s":"Same pattern at Snowflake. Since the seventh of August a provider can ship a Snowflake managed M C P server inside a Native App that exposes Cortex Search services, semantic views, stored procedures and U D F's as tools any agent can call. Databricks has the Genie One managed M C P server in beta doing the equivalent. Two competitors, one conclusion. M C P is becoming the contract between agents and the data platform, so decide deliberately whether you standardise on it, because otherwise you will standardise on it by accident."},{"t":"One more, for the deployment question. AWS made AgentCore runtime instances generally available, so agents can run on your own EC2 instances while AWS still handles provisioning, patching and scaling. That is a useful answer when data residency or specialised hardware rules out a fully managed runtime.","s":"One more, for the deployment question. AWS made AgentCore runtime instances generally available, so agents can run on your own E C two instances while AWS still handles provisioning, patching and scaling. That is a useful answer when data residency or specialised hardware rules out a fully managed runtime."}],"sources":[{"t":"What's new with Unity Catalog (Databricks)","u":"https://www.databricks.com/blog/whats-new-unity-catalog-data-ai-summit-2026"},{"t":"Snowflake Native Apps: Cortex Agents and MCP servers GA","u":"https://docs.snowflake.com/en/release-notes/2026/other/2026-08-07-native-apps-agents-mcp-ga"},{"t":"AgentCore runtime instances now generally available (AWS)","u":"https://aws.amazon.com/about-aws/whats-new/2026/08/aws-bedrock-agentcore-runtime-instances-generally-available/"}]},"nl":{"paras":[{"t":"Data Architects, let op de namespace. Het vierlaagse adres van Unity Catalog, dus metastore, catalog, schema en tabel, dekt nu ook modellen, MCP services, agents en skills. Een set toegangsregels, een audit spoor, en lineage tot op kolomniveau. Je catalogus wordt daarmee het register van je agents, of je dat nu zo bedoeld had of niet.","s":"Data Architects, let op de namespace. Het vierlaagse adres van Unity Catalog, dus metastore, catalog, schema en tabel, dekt nu ook modellen, M C P services, agents en skills. Een set toegangsregels, een audit spoor, en lineage tot op kolomniveau. Je catalogus wordt daarmee het register van je agents, of je dat nu zo bedoeld had of niet."},{"t":"Bij Snowflake zie je hetzelfde patroon. Sinds 7 augustus kan een leverancier een door Snowflake beheerde MCP server meeleveren in een Native App, die Cortex Search services, semantic views, stored procedures en UDF's aanbiedt als tools waar elke agent bij kan. Databricks heeft de Genie One managed MCP server in beta, die hetzelfde doet. Twee concurrenten, dezelfde conclusie. MCP wordt het contract tussen agents en je dataplatform. Kies daar dus bewust voor, want anders kies je er per ongeluk voor.","s":"Bij Snowflake zie je hetzelfde patroon. Sinds zeven augustus kan een leverancier een door Snowflake beheerde M C P server meeleveren in een Native App, die Cortex Search services, semantic views, stored procedures en U D F's aanbiedt als tools waar elke agent bij kan. Databricks heeft de Genie One managed M C P server in beta, die hetzelfde doet. Twee concurrenten, dezelfde conclusie. M C P wordt het contract tussen agents en je dataplatform. Kies daar dus bewust voor, want anders kies je er per ongeluk voor."},{"t":"Nog een, voor de vraag waar het allemaal draait. AWS maakte AgentCore runtime instances algemeen beschikbaar. Je agents draaien dan op je eigen EC2 instances, terwijl AWS het provisionen, patchen en schalen doet. Handig als data residency of speciale hardware een volledig beheerde runtime uitsluit.","s":"Nog een, voor de vraag waar het allemaal draait. AWS maakte AgentCore runtime instances algemeen beschikbaar. Je agents draaien dan op je eigen E C twee instances, terwijl AWS het provisionen, patchen en schalen doet. Handig als data residency of speciale hardware een volledig beheerde runtime uitsluit."}],"sources":[{"t":"What's new with Unity Catalog (Databricks)","u":"https://www.databricks.com/blog/whats-new-unity-catalog-data-ai-summit-2026"},{"t":"Snowflake Native Apps: Cortex Agents and MCP servers GA","u":"https://docs.snowflake.com/en/release-notes/2026/other/2026-08-07-native-apps-agents-mcp-ga"},{"t":"AgentCore runtime instances now generally available (AWS)","u":"https://aws.amazon.com/about-aws/whats-new/2026/08/aws-bedrock-agentcore-runtime-instances-generally-available/"}]}},{"id":"delivery","title":{"en":"Delivery Managers","nl":"Delivery Managers"},"en":{"paras":[{"t":"Delivery Managers. The consulting model is being rewritten in public. Business Insider reporting on 23 August: Accenture added nearly forty thousand AI and data people in two years, EY added sixty one thousand technologists since 2023, and PwC opened its first new engineering career track in a hundred and seventy years. Clients are buying subscription style products and managed services, not decks.","s":"Delivery Managers. The consulting model is being rewritten in public. Business Insider reporting on the twenty third of August. Accenture added nearly forty thousand A I and data people in two years, EY added sixty one thousand technologists since twenty twenty three, and PwC opened its first new engineering career track in a hundred and seventy years. Clients are buying subscription style products and managed services, not decks."},{"t":"Forrester's Craig Le Clair frames the choice well. Packaged agents from the big software vendors spread fastest, but they drift toward being interchangeable, so buyers end up negotiating on price. Custom agents, built on a client's own processes and data, are the ones that can own a process end to end. That is where outcome pricing actually holds, because nobody pays an outcome price for a feature they can switch on themselves."},{"t":"Now the counterweight, from the same VentureBeat research. One in five enterprises cannot halt a runaway agent's spend in real time, and a quarter have already had an infinite loop bill. If you are signing for an outcome, token spend is your margin. Put a cost gateway, a cost attribution model and a kill switch in the statement of work before you sign, not after the first invoice."}],"sources":[{"t":"Consulting is turning into agent delivery, not decks","u":"https://www.marketscale.com/industries/business-services/consulting-is-turning-into-agent-delivery-not-decks-as-big-firms-chase-ai-native-work"},{"t":"Forrester, The Agentic AI Race: Why The Tortoise May Beat The Hare","u":"https://www.forrester.com/blogs/the-agentic-ai-race-why-the-tortoise-may-beat-the-hare/"},{"t":"VentureBeat: one in five enterprises can't stop a runaway AI agent's spending in real time","u":"https://venturebeat.com/orchestration/one-in-five-enterprises-cant-stop-a-runaway-ai-agents-spending-in-real-time"}]},"nl":{"paras":[{"t":"Delivery Managers, het verdienmodel van consultancy wordt op dit moment in het openbaar herschreven. Business Insider berichtte op 23 augustus dat Accenture er in twee jaar bijna veertigduizend AI en data mensen bij heeft genomen, dat EY sinds 2023 eenenzestigduizend technologen heeft aangenomen, en dat PwC voor het eerst in honderdzeventig jaar een nieuw loopbaanpad voor engineers heeft geopend. Klanten kopen abonnementen op producten en managed services, geen presentaties.","s":"Delivery Managers, het verdienmodel van consultancy wordt op dit moment in het openbaar herschreven. Business Insider berichtte op drieentwintig augustus dat Accenture er in twee jaar bijna veertigduizend A I en data mensen bij heeft genomen, dat EY sinds tweeduizend drieentwintig eenenzestigduizend technologen heeft aangenomen, en dat PwC voor het eerst in honderdzeventig jaar een nieuw loopbaanpad voor engineers heeft geopend. Klanten kopen abonnementen op producten en managed services, geen presentaties."},{"t":"Forrester analist Craig Le Clair verwoordt de keuze goed. Kant en klare agents van de grote softwareleveranciers gaan het snelst rond, maar ze gaan ook steeds meer op elkaar lijken, en dan eindig je in een prijsonderhandeling. Agents op maat, gebouwd op de processen en de data van de klant zelf, kunnen wel een proces van begin tot eind dragen. Daar houdt een prijs op resultaat stand, want niemand betaalt een resultaatprijs voor een knop die hij zelf kan aanzetten."},{"t":"En dan het tegenwicht, uit hetzelfde onderzoek van VentureBeat. Een op de vijf bedrijven kan de uitgaven van een ontspoorde agent niet in real time stoppen, en een kwart heeft al een rekening van een oneindige lus gehad. Teken je voor een resultaat, dan zijn die tokens jouw marge. Zet dus een kostengateway, een verdeling van kosten per team en een noodstop in de statement of work voordat je tekent, niet na de eerste factuur."}],"sources":[{"t":"Consulting is turning into agent delivery, not decks","u":"https://www.marketscale.com/industries/business-services/consulting-is-turning-into-agent-delivery-not-decks-as-big-firms-chase-ai-native-work"},{"t":"Forrester, The Agentic AI Race: Why The Tortoise May Beat The Hare","u":"https://www.forrester.com/blogs/the-agentic-ai-race-why-the-tortoise-may-beat-the-hare/"},{"t":"VentureBeat: one in five enterprises can't stop a runaway AI agent's spending in real time","u":"https://venturebeat.com/orchestration/one-in-five-enterprises-cant-stop-a-runaway-ai-agents-spending-in-real-time"}]}},{"id":"outro","title":{"en":"Wrap up","nl":"Afsluiting"},"en":{"paras":[{"t":"That is the briefing for this week. The full text and every source is on screen if you want to check something. See you next Monday."}],"sources":[]},"nl":{"paras":[{"t":"Dat was de briefing van deze week. De volledige tekst en alle bronnen staan op het scherm, mocht je iets willen nakijken. Tot volgende week maandag."}],"sources":[]}}]},{"date":"2026-08-21","label":{"en":"21 August 2026","nl":"21 augustus 2026"},"summary":{"en":"Genie Code gets a cost dial","nl":"Genie Code krijgt een kostenknop"},"en":{"paras":[{"t":"Good morning Ton, here is your Monday AI briefing. This week Databricks put a cost dial on its coding agent, and OpenAI drew a line under what it keeps of your data. Both matter more for fixed price work than they look at first.","s":"Good morning Ton, here is your Monday A I briefing. This week Databricks put a cost dial on its coding agent, and OpenAI drew a line under what it keeps of your data. Both matter more for fixed price work than they look at first."},{"t":"Start with the data tools. On 19 August Databricks added effort levels to Genie Code. Auto still gives the best answers, but you can now put a task on Low and run a faster, cheaper model. Small button, big consequence. Your team picks per task how much intelligence it pays for, and that is exactly the knob you want when the price is fixed and the margin is yours. Genie Code also got file uploads on 14 August, so a colleague can drop a spec or a CSV in as context. And on 17 August came something Data Engineers will like. Session restore for serverless jobs, in beta. When a job fails, is cancelled, or runs over thirty minutes, Databricks snapshots the Python variables and the Spark session, and you pull that state into a notebook. No more rerunning a two hour pipeline to find out what went wrong.","s":"Start with the data tools. On the nineteenth of August Databricks added effort levels to Genie Code. Auto still gives the best answers, but you can now put a task on Low and run a faster, cheaper model. Small button, big consequence. Your team picks per task how much intelligence it pays for, and that is exactly the knob you want when the price is fixed and the margin is yours. Genie Code also got file uploads on the fourteenth of August, so a colleague can drop a spec or a C S V in as context. And on the seventeenth of August came something Data Engineers will like. Session restore for serverless jobs, in beta. When a job fails, is cancelled, or runs over thirty minutes, Databricks snapshots the Python variables and the Spark session, and you pull that state into a notebook. No more rerunning a two hour pipeline to find out what went wrong."},{"t":"On the BI side, the August Power BI update landed. Copilot now works inside SharePoint embedded reports. Measure descriptions are generally available, with Copilot writing them for you. And filtered summaries are in preview in standalone Copilot, so you ask what sales were in 2024 and get a filtered answer inline, without opening the report.","s":"On the B I side, the August Power B I update landed. Copilot now works inside SharePoint embedded reports. Measure descriptions are generally available, with Copilot writing them for you. And filtered summaries are in preview in standalone Copilot, so you ask what sales were in twenty twenty four and get a filtered answer inline, without opening the report."},{"t":"For delivery and consulting it was a thin news week, with one exception. On 19 August OpenAI reaffirmed Zero Data Retention for eligible API customers and previewed Private Safety Processing. It spots misuse patterns across related sessions without anyone at OpenAI seeing the content, and zero retention stays intact. Rollout and a white paper come in September. Read it before your next client conversation about where the prompts actually go.","s":"For delivery and consulting it was a thin news week, with one exception. On the nineteenth of August OpenAI reaffirmed Zero Data Retention for eligible A P I customers and previewed Private Safety Processing. It spots misuse patterns across related sessions without anyone at OpenAI seeing the content, and zero retention stays intact. Rollout and a white paper come in September. Read it before your next client conversation about where the prompts actually go."},{"t":"One recommendation. Demo Genie Code with the effort dial in this week's session. Run the same question on Auto and on Low, and show how many Databricks units each one burns. That turns an abstract AI debate into a cost per task conversation, which is the one your teams need to be having.","s":"One recommendation. Demo Genie Code with the effort dial in this week's session. Run the same question on Auto and on Low, and show how many Databricks units each one burns. That turns an abstract A I debate into a cost per task conversation, which is the one your teams need to be having."}],"sources":[{"t":"Azure Databricks platform release notes, August 2026","u":"https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2026/august"},{"t":"Power BI August 2026 Feature Summary","u":"https://community.fabric.microsoft.com/blog/fbc_pbiupdatesblog/power-bi-august-2026-feature-summary/5348434"},{"t":"OpenAI, Offering Zero Data Retention for frontier models","u":"https://openai.com/index/offering-zero-data-retention-for-frontier-models/"},{"t":"Databricks AI/BI and Genie One release notes 2026","u":"https://learn.microsoft.com/en-us/azure/databricks/ai-bi/release-notes/2026"}]},"nl":{"paras":[{"t":"Goedemorgen Ton, hier is je maandagbriefing over AI. Deze week zette Databricks een kostenknop op zijn coding agent, en trok OpenAI een streep onder wat het wel en niet bewaart van jouw data. Allebei belangrijker voor fixed price werk dan ze lijken.","s":"Goedemorgen Ton, hier is je maandagbriefing over A I. Deze week zette Databricks een kostenknop op zijn coding agent, en trok OpenAI een streep onder wat het wel en niet bewaart van jouw data. Allebei belangrijker voor fixed price werk dan ze lijken."},{"t":"Eerst de datatools. Op 19 augustus kreeg Genie Code effort levels. Auto geeft nog steeds de beste antwoorden, maar je kunt een taak nu op Low zetten en een sneller, goedkoper model gebruiken. Klein knopje, groot gevolg. Je team kiest per taak hoeveel intelligentie het betaalt, en dat is precies de knop die je wilt als de prijs vaststaat en de marge van jou is. Genie Code kreeg op 14 augustus ook file uploads, dus een collega gooit een spec of een CSV in de chat als context. En op 17 augustus kwam er iets waar Data Engineers blij van worden. Session restore voor serverless jobs, in beta. Als een job faalt, wordt geannuleerd, of langer dan dertig minuten draait, maakt Databricks een snapshot van de Python variabelen en de Spark sessie. Die haal je daarna in een notebook binnen. Geen pipeline van twee uur meer opnieuw draaien om te zien wat er misging.","s":"Eerst de datatools. Op negentien augustus kreeg Genie Code effort levels. Auto geeft nog steeds de beste antwoorden, maar je kunt een taak nu op Low zetten en een sneller, goedkoper model gebruiken. Klein knopje, groot gevolg. Je team kiest per taak hoeveel intelligentie het betaalt, en dat is precies de knop die je wilt als de prijs vaststaat en de marge van jou is. Genie Code kreeg op veertien augustus ook file uploads, dus een collega gooit een spec of een C S V in de chat als context. En op zeventien augustus kwam er iets waar Data Engineers blij van worden. Session restore voor serverless jobs, in beta. Als een job faalt, wordt geannuleerd, of langer dan dertig minuten draait, maakt Databricks een snapshot van de Python variabelen en de Spark sessie. Die haal je daarna in een notebook binnen. Geen pipeline van twee uur meer opnieuw draaien om te zien wat er misging."},{"t":"Aan de BI kant kwam de Power BI update van augustus. Copilot werkt nu in SharePoint embedded reports. Measure descriptions zijn algemeen beschikbaar, en Copilot schrijft ze voor je. En filtered summaries staan in preview in de losse Copilot, dus je vraagt wat de verkoop in 2024 was en krijgt meteen een gefilterd antwoord, zonder het rapport te openen.","s":"Aan de B I kant kwam de Power B I update van augustus. Copilot werkt nu in SharePoint embedded reports. Measure descriptions zijn algemeen beschikbaar, en Copilot schrijft ze voor je. En filtered summaries staan in preview in de losse Copilot, dus je vraagt wat de verkoop in tweeduizend vierentwintig was en krijgt meteen een gefilterd antwoord, zonder het rapport te openen."},{"t":"Voor delivery en consulting was het een magere nieuwsweek, met een uitzondering. Op 19 augustus bevestigde OpenAI Zero Data Retention voor API klanten en liet het Private Safety Processing zien. Dat zoekt misbruikpatronen over meerdere sessies heen zonder dat iemand bij OpenAI de inhoud ziet, en zero retention blijft overeind. De uitrol en een white paper komen in september. Lees het voor je volgende klantgesprek over waar die prompts blijven.","s":"Voor delivery en consulting was het een magere nieuwsweek, met een uitzondering. Op negentien augustus bevestigde OpenAI Zero Data Retention voor A P I klanten en liet het Private Safety Processing zien. Dat zoekt misbruikpatronen over meerdere sessies heen zonder dat iemand bij OpenAI de inhoud ziet, en zero retention blijft overeind. De uitrol en een white paper komen in september. Lees het voor je volgende klantgesprek over waar die prompts blijven."},{"t":"Een aanbeveling. Laat Genie Code met de effort knop zien in de sessie van deze week. Draai dezelfde vraag op Auto en op Low, en laat zien hoeveel Databricks units elk kost. Dan verandert een abstracte AI discussie in een gesprek over kosten per taak, en dat gesprek moeten je teams voeren. Fijne week.","s":"Een aanbeveling. Laat Genie Code met de effort knop zien in de sessie van deze week. Draai dezelfde vraag op Auto en op Low, en laat zien hoeveel Databricks units elk kost. Dan verandert een abstracte A I discussie in een gesprek over kosten per taak, en dat gesprek moeten je teams voeren. Fijne week."}],"sources":[{"t":"Azure Databricks platform release notes, August 2026","u":"https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2026/august"},{"t":"Power BI August 2026 Feature Summary","u":"https://community.fabric.microsoft.com/blog/fbc_pbiupdatesblog/power-bi-august-2026-feature-summary/5348434"},{"t":"OpenAI, Offering Zero Data Retention for frontier models","u":"https://openai.com/index/offering-zero-data-retention-for-frontier-models/"},{"t":"Databricks AI/BI and Genie One release notes 2026","u":"https://learn.microsoft.com/en-us/azure/databricks/ai-bi/release-notes/2026"}]}},{"date":"2026-08-14","label":{"en":"14 August 2026","nl":"14 augustus 2026"},"summary":{"en":"Cost dashboards and portable agent plugins","nl":"Kostendashboards en draagbare agent plugins"},"en":{"paras":[{"t":"Good morning Ton, here is your Monday AI briefing. Nobody shipped a flashy new model this week. They shipped plumbing, and it is about cost and portability. On the seventh of August Snowflake made Cortex Agents and MCP servers in Native Apps generally available. A provider can now ship an app with a conversational agent on top of the data it shares, plus a Snowflake managed MCP server that exposes Cortex Search services, semantic views and stored procedures as tools any agent can call. For a BI Consultant that is the interesting bit. Your semantic layer stops being something people look at and becomes something an agent calls. Databricks has been quiet since the sixth and there is no Power BI August summary yet, so Microsoft is quiet too.","s":"Good morning Ton, here is your Monday A I briefing. Nobody shipped a flashy new model this week. They shipped plumbing, and it is about cost and portability. On the seventh of August Snowflake made Cortex Agents and M C P servers in Native Apps generally available. A provider can now ship an app with a conversational agent on top of the data it shares, plus a Snowflake managed M C P server that exposes Cortex Search services, semantic views and stored procedures as tools any agent can call. For a B I Consultant that is the interesting bit. Your semantic layer stops being something people look at and becomes something an agent calls. Databricks has been quiet since the sixth and there is no Power B I August summary yet, so Microsoft is quiet too."},{"t":"Now delivery, and this one is for you. On the seventh of August GitHub added a Potential return on investment section to the Copilot impact dashboard. It puts two groups side by side. Developers who mostly use chat and completions, against agent first developers. For each it shows cost per developer per month from real credit consumption, that cost as a share of payroll, and pull requests per developer per month. There is a salary selector so you can model your own numbers. On the eleventh the usage report also got a per model token breakdown. Spend and output finally sit on the same screen. In a fixed price model that is the number you need, though GitHub calls the figures directional, so treat them as a baseline.","s":"Now delivery, and this one is for you. On the seventh of August GitHub added a Potential return on investment section to the Copilot impact dashboard. It puts two groups side by side. Developers who mostly use chat and completions, against agent first developers. For each it shows cost per developer per month from real credit consumption, that cost as a share of payroll, and pull requests per developer per month. There is a salary selector so you can model your own numbers. On the eleventh the usage report also got a per model token breakdown. Spend and output finally sit on the same screen. In a fixed price model that is the number you need, though GitHub calls the figures directional, so treat them as a baseline."},{"t":"To demo, GitHub published Agent Plugins 1.0 on the sixth of August with AWS, Microsoft, OpenAI, Vercel and Anysphere, and Google joined the same day. Support went generally available on the twelfth in VS Code, Copilot CLI, the Copilot SDK and the Copilot app. One package bundles a skill and an MCP server, and that same package runs across all of them.","s":"To demo, GitHub published Agent Plugins one point zero on the sixth of August with AWS, Microsoft, Open A I, Vercel and Anysphere, and Google joined the same day. Support went generally available on the twelfth in VS Code, Copilot C L I, the Copilot S D K and the Copilot app. One package bundles a skill and an M C P server, and that same package runs across all of them."},{"t":"That is my pick for this week's session. Have a colleague build one small plugin, a runbook skill plus the MCP server it needs, then install it in VS Code and in the CLI in the same half hour. It is concrete, and it turns sharing our AI practice into something you can hand to eighty consultants. Have a good week.","s":"That is my pick for this week's session. Have a colleague build one small plugin, a runbook skill plus the M C P server it needs, then install it in VS Code and in the C L I in the same half hour. It is concrete, and it turns sharing our A I practice into something you can hand to eighty consultants. Have a good week."}],"sources":[{"t":"Snowflake Native Apps: Cortex Agents and MCP servers GA (7 Aug 2026)","u":"https://docs.snowflake.com/en/release-notes/2026/other/2026-08-07-native-apps-agents-mcp-ga"},{"t":"Copilot impact dashboard adds a return on investment section (GitHub, 7 Aug 2026)","u":"https://github.blog/changelog/2026-08-07-copilot-impact-dashboard-adds-a-return-on-investment-section/"},{"t":"Per-model token breakdown in the usage report (GitHub, 11 Aug 2026)","u":"https://github.blog/changelog/2026-08-11-per-model-token-breakdown-in-the-usage-report"},{"t":"Agent Plugins 1.0 in VS Code, Copilot CLI, and the Copilot app (GitHub, 12 Aug 2026)","u":"https://github.blog/changelog/2026-08-12-agent-plugins-1-0-in-vs-code-copilot-cli-and-the-copilot-app"}]},"nl":{"paras":[{"t":"Goedemorgen Ton, hier is je maandagbriefing over AI. Er kwam deze week geen spectaculair nieuw model. Wat er wel kwam is leidingwerk, en dat gaat over kosten en draagbaarheid. Op zeven augustus heeft Snowflake Cortex Agents en MCP servers in Native Apps algemeen beschikbaar gemaakt. Een leverancier kan nu een app uitleveren met een eigen gespreksagent bovenop de data die hij deelt, plus een door Snowflake beheerde MCP server die Cortex Search services, semantic views en stored procedures aanbiedt als tools die elke agent kan aanroepen. Voor een BI Consultant zit daar het punt. Je semantische laag is niet iets om naar te kijken, het is iets dat een agent aanroept. Databricks is stil sinds zes augustus en een Power BI augustus samenvatting is er nog niet, dus Microsoft is ook stil.","s":"Goedemorgen Ton, hier is je maandagbriefing over A I. Er kwam deze week geen spectaculair nieuw model. Wat er wel kwam is leidingwerk, en dat gaat over kosten en draagbaarheid. Op zeven augustus heeft Snowflake Cortex Agents en M C P servers in Native Apps algemeen beschikbaar gemaakt. Een leverancier kan nu een app uitleveren met een eigen gespreksagent bovenop de data die hij deelt, plus een door Snowflake beheerde M C P server die Cortex Search services, semantic views en stored procedures aanbiedt als tools die elke agent kan aanroepen. Voor een B I Consultant zit daar het punt. Je semantische laag is niet iets om naar te kijken, het is iets dat een agent aanroept. Databricks is stil sinds zes augustus en een Power B I augustus samenvatting is er nog niet, dus Microsoft is ook stil."},{"t":"Dan levering, en die is voor jou. Op zeven augustus zette GitHub een sectie Potential return on investment in het Copilot impact dashboard. Twee groepen naast elkaar. Ontwikkelaars die vooral chat en completions gebruiken, tegenover ontwikkelaars die agent first werken. Per groep zie je de kosten per ontwikkelaar per maand op basis van echt verbruik, die kosten als percentage van de loonsom, en het aantal pull requests per ontwikkelaar per maand. Er is een salarisschuif om met je eigen cijfers te rekenen. Op elf augustus kwam er ook een uitsplitsing per model in het verbruiksrapport. Uitgaven en output staan eindelijk op hetzelfde scherm. In een fixed price model is dat precies het getal dat je nodig hebt, al noemt GitHub de cijfers richtinggevend, dus gebruik ze als nulmeting.","s":"Dan levering, en die is voor jou. Op zeven augustus zette GitHub een sectie Potential return on investment in het Copilot impact dashboard. Twee groepen naast elkaar. Ontwikkelaars die vooral chat en completions gebruiken, tegenover ontwikkelaars die agent first werken. Per groep zie je de kosten per ontwikkelaar per maand op basis van echt verbruik, die kosten als percentage van de loonsom, en het aantal pull requests per ontwikkelaar per maand. Er is een salarisschuif om met je eigen cijfers te rekenen. Op elf augustus kwam er ook een uitsplitsing per model in het verbruiksrapport. Uitgaven en output staan eindelijk op hetzelfde scherm. In een fixed price model is dat precies het getal dat je nodig hebt, al noemt GitHub de cijfers richtinggevend, dus gebruik ze als nulmeting."},{"t":"Iets om te laten zien. GitHub publiceerde op zes augustus Agent Plugins 1.0, samen met AWS, Microsoft, OpenAI, Vercel en Anysphere, en Google stapte diezelfde dag in. Op twaalf augustus werd de ondersteuning algemeen beschikbaar in VS Code, Copilot CLI, de Copilot SDK en de Copilot app. Eén pakket bundelt een skill en een MCP server, en datzelfde pakket draait overal.","s":"Iets om te laten zien. GitHub publiceerde op zes augustus Agent Plugins een punt nul, samen met AWS, Microsoft, Open A I, Vercel en Anysphere, en Google stapte diezelfde dag in. Op twaalf augustus werd de ondersteuning algemeen beschikbaar in VS Code, Copilot C L I, de Copilot S D K en de Copilot app. Eén pakket bundelt een skill en een M C P server, en datzelfde pakket draait overal."},{"t":"Dat is mijn keuze voor de sessie van deze week. Laat een collega één kleine plugin bouwen, een runbook skill plus de MCP server die daarbij hoort, en installeer die binnen datzelfde halfuur in VS Code en in de CLI. Het is concreet, en het maakt van onze AI praktijk delen iets dat je echt aan tachtig consultants kunt geven. Fijne week.","s":"Dat is mijn keuze voor de sessie van deze week. Laat een collega één kleine plugin bouwen, een runbook skill plus de M C P server die daarbij hoort, en installeer die binnen datzelfde halfuur in VS Code en in de C L I. Het is concreet, en het maakt van onze A I praktijk delen iets dat je echt aan tachtig consultants kunt geven. Fijne week."}],"sources":[{"t":"Snowflake Native Apps: Cortex Agents and MCP servers GA (7 Aug 2026)","u":"https://docs.snowflake.com/en/release-notes/2026/other/2026-08-07-native-apps-agents-mcp-ga"},{"t":"Copilot impact dashboard adds a return on investment section (GitHub, 7 Aug 2026)","u":"https://github.blog/changelog/2026-08-07-copilot-impact-dashboard-adds-a-return-on-investment-section/"},{"t":"Per-model token breakdown in the usage report (GitHub, 11 Aug 2026)","u":"https://github.blog/changelog/2026-08-11-per-model-token-breakdown-in-the-usage-report"},{"t":"Agent Plugins 1.0 in VS Code, Copilot CLI, and the Copilot app (GitHub, 12 Aug 2026)","u":"https://github.blog/changelog/2026-08-12-agent-plugins-1-0-in-vs-code-copilot-cli-and-the-copilot-app"}]}},{"date":"2026-08-07","label":{"en":"7 August 2026","nl":"7 augustus 2026"},"summary":{"en":"Both lakehouses ship AI cost gateways","nl":"Beide lakehouses lanceren AI-kostengateways"},"en":{"paras":[{"t":"Good morning Ton, here is your Monday AI briefing. Two rival data platforms shipped almost the same product within a week of each other, and that tells you exactly where the pain is right now.","s":"Good morning Ton, here is your Monday A I briefing. Two rival data platforms shipped almost the same product within a week of each other, and that tells you exactly where the pain is right now."},{"t":"Start with the practical stuff for the teams. Databricks pushed a Genie One update on the sixth of August. The Genie Ontology is now on by default in public preview. That is a business context layer giving Genie a map of how your organisation actually names and defines things, and it is the difference between a text to SQL toy and something a Business Analyst will trust in front of a client. You can now also upload PDF files into a Genie One conversation, next to CSV and Excel. And on the third of August Databricks extended free usage of Genie One and Genie Agents all the way to the end of January 2027, so the budget excuse is gone.","s":"Start with the practical stuff for the teams. Databricks pushed a Genie One update on the sixth of August. The Genie Ontology is now on by default in public preview. That is a business context layer giving Genie a map of how your organisation actually names and defines things, and it is the difference between a text to S Q L toy and something a Business Analyst will trust in front of a client. You can now also upload P D F files into a Genie One conversation, next to C S V and Excel. And on the third of August Databricks extended free usage of Genie One and Genie Agents all the way to the end of January twenty twenty seven, so the budget excuse is gone."},{"t":"Now delivery and consulting, and this is the one to pay attention to. Databricks made Unity AI Gateway generally available on the fourth of August. Snowflake launched Cortex AI Gateway at Black Hat a week earlier. Both do the same job: one control plane in front of every agent, model and MCP server, with hard spend caps, cost attribution per team and per user, and smart routing that sends simple tasks to cheap models. Databricks says over a quadrillion tokens passed through its gateway in the past year. Read that as a warning about scale. In a fixed price model, tokens are your margin, and you cannot defend a margin you cannot attribute.","s":"Now delivery and consulting, and this is the one to pay attention to. Databricks made Unity A I Gateway generally available on the fourth of August. Snowflake launched Cortex A I Gateway at Black Hat a week earlier. Both do the same job. One control plane in front of every agent, model and M C P server, with hard spend caps, cost attribution per team and per user, and smart routing that sends simple tasks to cheap models. Databricks says over a quadrillion tokens passed through its gateway in the past year. Read that as a warning about scale. In a fixed price model, tokens are your margin, and you cannot defend a margin you cannot attribute."},{"t":"For something a colleague can demo in thirty minutes, GitHub shipped comment triggered Copilot automations on the third of August. You leave a comment on an issue or a pull request, and a cloud agent picks it up and does the work. Regenerate the documentation after a code change, dig through a stack trace on a bug ticket, or open follow up issues for technical debt. You configure the trigger phrase yourself in the Agents tab.","s":"For something a colleague can demo in thirty minutes, GitHub shipped comment triggered Copilot automations on the third of August. You leave a comment on an issue or a pull request, and a cloud agent picks it up and does the work. Regenerate the documentation after a code change, dig through a stack trace on a bug ticket, or open follow up issues for technical debt. You configure the trigger phrase yourself in the Agents tab."},{"t":"That last one is my pick for this week's session. It takes ten minutes to set up, every team already has a repository, and watching an agent respond to a comment makes agentic delivery concrete instead of theoretical. Have a good week.","s":"That last one is my pick for this week's session. It takes ten minutes to set up, every team already has a repository, and watching an agent respond to a comment makes agentic delivery concrete instead of theoretical. Have a good week."}],"sources":[{"t":"Databricks AI/BI and Genie One release notes 2026","u":"https://docs.databricks.com/aws/en/ai-bi/release-notes/2026"},{"t":"Unity AI Gateway is Generally Available (Databricks, 4 Aug 2026)","u":"https://www.databricks.com/blog/unity-ai-gateway-generally-available"},{"t":"Snowflake launches Cortex AI Gateway at Black Hat 2026","u":"https://www.snowflake.com/en/blog/enterprise-ai-security-agentic-mcp-governance/"},{"t":"Trigger Copilot automations with comments (GitHub, 3 Aug 2026)","u":"https://github.blog/changelog/2026-08-03-trigger-copilot-automations-with-comments/"}]},"nl":{"paras":[{"t":"Goedemorgen Ton, hier is je maandagbriefing over AI. Twee concurrerende dataplatformen brachten binnen een week vrijwel hetzelfde product uit, en dat zegt precies waar de pijn nu zit.","s":"Goedemorgen Ton, hier is je maandagbriefing over A I. Twee concurrerende dataplatformen brachten binnen een week vrijwel hetzelfde product uit, en dat zegt precies waar de pijn nu zit."},{"t":"Eerst het praktische voor de teams. Databricks bracht op 6 augustus een Genie One update uit. De Genie Ontology staat nu standaard aan, in public preview. Dat is een laag met bedrijfscontext die Genie een kaart geeft van hoe jouw organisatie dingen echt noemt en definieert. Dat is het verschil tussen een tekst naar SQL speeltje en iets waar een Business Analist bij de klant op durft te leunen. Je kunt nu ook PDF bestanden uploaden in een Genie One gesprek, naast CSV en Excel. En op 3 augustus verlengde Databricks het gratis gebruik van Genie One en Genie Agents tot eind januari 2027, dus het budgetexcuus is weg.","s":"Eerst het praktische voor de teams. Databricks bracht op zes augustus een Genie One update uit. De Genie Ontology staat nu standaard aan, in public preview. Dat is een laag met bedrijfscontext die Genie een kaart geeft van hoe jouw organisatie dingen echt noemt en definieert. Dat is het verschil tussen een tekst naar S Q L speeltje en iets waar een Business Analist bij de klant op durft te leunen. Je kunt nu ook P D F bestanden uploaden in een Genie One gesprek, naast C S V en Excel. En op drie augustus verlengde Databricks het gratis gebruik van Genie One en Genie Agents tot eind januari tweeduizend zevenentwintig, dus het budgetexcuus is weg."},{"t":"Dan delivery en consulting, en hier moet je echt even op letten. Databricks maakte Unity AI Gateway op 4 augustus algemeen beschikbaar. Snowflake lanceerde een week eerder Cortex AI Gateway op Black Hat. Beide doen hetzelfde werk: één controlelaag voor elke agent, elk model en elke MCP server, met harde uitgavenplafonds, kostentoerekening per team en per gebruiker, en slimme routering die eenvoudige taken naar goedkope modellen stuurt. Databricks zegt dat er het afgelopen jaar meer dan duizend biljoen tokens door hun gateway zijn gegaan. Lees dat als een waarschuwing over schaal. In een fixed price model zijn tokens je marge, en je kunt geen marge verdedigen die je niet kunt toerekenen.","s":"Dan delivery en consulting, en hier moet je echt even op letten. Databricks maakte Unity A I Gateway op vier augustus algemeen beschikbaar. Snowflake lanceerde een week eerder Cortex A I Gateway op Black Hat. Beide doen hetzelfde werk. Eén controlelaag voor elke agent, elk model en elke M C P server, met harde uitgavenplafonds, kostentoerekening per team en per gebruiker, en slimme routering die eenvoudige taken naar goedkope modellen stuurt. Databricks zegt dat er het afgelopen jaar meer dan duizend biljoen tokens door hun gateway zijn gegaan. Lees dat als een waarschuwing over schaal. In een fixed price model zijn tokens je marge, en je kunt geen marge verdedigen die je niet kunt toerekenen."},{"t":"En iets wat een collega in dertig minuten kan demonstreren: GitHub bracht op 3 augustus Copilot automations uit die je met een comment start. Je zet een reactie onder een issue of een pull request, en een cloud agent pakt het op en gaat aan de slag. Documentatie bijwerken na een codewijziging, een stack trace uitpluizen bij een bug ticket, of vervolgissues aanmaken voor technische schuld. De triggerzin stel je zelf in op het Agents tabblad.","s":"En iets wat een collega in dertig minuten kan demonstreren. GitHub bracht op drie augustus Copilot automations uit die je met een comment start. Je zet een reactie onder een issue of een pull request, en een cloud agent pakt het op en gaat aan de slag. Documentatie bijwerken na een codewijziging, een stack trace uitpluizen bij een bug ticket, of vervolgissues aanmaken voor technische schuld. De triggerzin stel je zelf in op het Agents tabblad."},{"t":"Die laatste is mijn tip voor de sessie van deze week. Het opzetten kost tien minuten, elk team heeft al een repository, en een agent zien reageren op een comment maakt agentic delivery concreet in plaats van theoretisch. Fijne week.","s":"Die laatste is mijn tip voor de sessie van deze week. Het opzetten kost tien minuten, elk team heeft al een repository, en een agent zien reageren op een comment maakt agentic delivery concreet in plaats van theoretisch. Fijne week."}],"sources":[{"t":"Databricks AI/BI en Genie One release notes 2026","u":"https://docs.databricks.com/aws/en/ai-bi/release-notes/2026"},{"t":"Unity AI Gateway algemeen beschikbaar (Databricks, 4 aug 2026)","u":"https://www.databricks.com/blog/unity-ai-gateway-generally-available"},{"t":"Snowflake lanceert Cortex AI Gateway op Black Hat 2026","u":"https://www.snowflake.com/en/blog/enterprise-ai-security-agentic-mcp-governance/"},{"t":"Copilot automations starten met een comment (GitHub, 3 aug 2026)","u":"https://github.blog/changelog/2026-08-03-trigger-copilot-automations-with-comments/"}]}},{"date":"2026-07-31","label":{"en":"31 July 2026","nl":"31 juli 2026"},"summary":{"en":"Genie reaches Teams, Power BI answers in Copilot","nl":"Genie komt in Teams, Power BI antwoordt in Copilot"},"en":{"paras":[{"t":"Good morning Ton, here is your Monday AI briefing. Quiet week for flashy launches, busy week in the plumbing your teams actually work in.","s":"Good morning Ton, here is your Monday A I briefing. Quiet week for flashy launches, busy week in the plumbing your teams actually work in."},{"t":"Start with the data work. Databricks shipped a run of Genie updates. Since the seventeenth there is a Genie app for Microsoft Teams in public preview, so a business analyst can ask a data question in a Teams chat and get an answer without opening a workspace. On the sixteenth the Lakebridge Agentic Converter went to beta. It takes legacy SQL, T-SQL, Oracle, Teradata, Redshift, BigQuery, and converts it to ANSI SQL. It checks syntax and intent, and fixes its own errors before writing the result. That is migration work that used to eat weeks. One warning: the free window for Genie One and Genie Agents ends today. From tomorrow it is pay as you go, so tell your teams before someone gets a surprise bill.","s":"Start with the data work. Databricks shipped a run of Genie updates. Since the seventeenth there is a Genie app for Microsoft Teams in public preview, so a business analyst can ask a data question in a Teams chat and get an answer without opening a workspace. On the sixteenth the Lakebridge Agentic Converter went to beta. It takes legacy S Q L, T S Q L, Oracle, Teradata, Redshift, BigQuery, and converts it to ANSI S Q L. It checks syntax and intent, and fixes its own errors before writing the result. That is migration work that used to eat weeks. One warning. The free window for Genie One and Genie Agents ends today. From tomorrow it is pay as you go, so tell your teams before someone gets a surprise bill."},{"t":"On the Microsoft side, the Power BI team spelled out on the twenty first where Copilot is heading. Power BI data can now answer questions directly inside Microsoft 365 Copilot Chat, in preview, and the heavier multi step work moves to Copilot Cowork, which is billed per use instead of a flat license. The line that matters for us: the semantic model is the advantage. AI pointed at raw tables gives answers that look right. Your measures and definitions are what make them trustworthy.","s":"On the Microsoft side, the Power B I team spelled out on the twenty first where Copilot is heading. Power B I data can now answer questions directly inside Microsoft three sixty five Copilot Chat, in preview, and the heavier multi step work moves to Copilot Cowork, which is billed per use instead of a flat license. The line that matters for us. The semantic model is the advantage. A I pointed at raw tables gives answers that look right. Your measures and definitions are what make them trustworthy."},{"t":"On models, Anthropic released Claude Opus 5 on the twenty fourth, best in class on coding and knowledge work at roughly half the price of Fable 5. Moonshot put the open weights of Kimi K3 out on the twenty seventh, the largest open model so far. Nothing landed this week that speaks directly to fixed price delivery, so I am skipping that theme.","s":"On models, Anthropic released Claude Opus five on the twenty fourth, best in class on coding and knowledge work at roughly half the price of Fable five. Moonshot put the open weights of Kimi K three out on the twenty seventh, the largest open model so far. Nothing landed this week that speaks directly to fixed price delivery, so I am skipping that theme."},{"t":"My pick for this week's session: Power BI answering questions inside Microsoft 365 Copilot Chat. It is visual, it takes five minutes to show, and it makes the case that the semantic model work your BI consultants already do is exactly what makes AI trustworthy. Have a good week.","s":"My pick for this week's session. Power B I answering questions inside Microsoft three sixty five Copilot Chat. It is visual, it takes five minutes to show, and it makes the case that the semantic model work your B I consultants already do is exactly what makes A I trustworthy. Have a good week."}],"sources":[{"t":"Azure Databricks release notes, July 2026","u":"https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2026/july"},{"t":"Bringing Power BI Insights to Every Copilot User","u":"https://community.fabric.microsoft.com/t5/Power-BI-Updates-Blog/Bringing-Power-BI-Insights-to-Every-Copilot-User/ba-p/5309360"},{"t":"Introducing Claude Opus 5","u":"https://www.anthropic.com/news/claude-opus-5"},{"t":"Moonshot unveils Kimi K3, largest open-weight model","u":"https://www.axios.com/2026/07/16/moonshot-kimi-ai-china-model-openai-anthropic"}]},"nl":{"paras":[{"t":"Goedemorgen Ton, hier is je maandagbriefing over AI. Rustige week qua grote lanceringen, drukke week in de leidingen waar je teams echt mee werken.","s":"Goedemorgen Ton, hier is je maandagbriefing over A I. Rustige week qua grote lanceringen, drukke week in de leidingen waar je teams echt mee werken."},{"t":"Eerst het datawerk. Databricks leverde een reeks Genie updates. Sinds zeventien juli is er een Genie app voor Microsoft Teams in public preview, zodat een business analist een datavraag in een Teams chat kan stellen en antwoord krijgt zonder een workspace te openen. Op zestien juli ging de Lakebridge Agentic Converter naar beta. Die pakt oude SQL, T-SQL, Oracle, Teradata, Redshift, BigQuery, en zet het om naar ANSI SQL. Hij controleert syntax en bedoeling, en repareert zijn eigen fouten voordat hij het resultaat wegschrijft. Dat is migratiewerk waar vroeger weken in gingen zitten.
