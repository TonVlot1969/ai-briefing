Eén waarschuwing: de gratis periode voor Genie One en Genie Agents stopt vandaag. Vanaf morgen is het pay as you go, dus zeg het je teams voordat iemand een onverwachte rekening krijgt.","s":"Eerst het datawerk. Databricks leverde een reeks Genie updates. Sinds zeventien juli is er een Genie app voor Microsoft Teams in public preview, zodat een business analist een datavraag in een Teams chat kan stellen en antwoord krijgt zonder een workspace te openen. Op zestien juli ging de Lakebridge Agentic Converter naar beta. Die pakt oude S Q L, T S Q L, Oracle, Teradata, Redshift, BigQuery, en zet het om naar ANSI S Q L. Hij controleert syntax en bedoeling, en repareert zijn eigen fouten voordat hij het resultaat wegschrijft. Dat is migratiewerk waar vroeger weken in gingen zitten. Eén waarschuwing. De gratis periode voor Genie One en Genie Agents stopt vandaag. Vanaf morgen is het pay as you go, dus zeg het je teams voordat iemand een onverwachte rekening krijgt."},{"t":"Aan de Microsoft kant legde het Power BI team op eenentwintig juli uit waar Copilot heen gaat. Power BI data kan nu rechtstreeks vragen beantwoorden in Microsoft 365 Copilot Chat, in preview, en het zwaardere werk in meerdere stappen verhuist naar Copilot Cowork, dat per gebruik wordt afgerekend in plaats van een vaste licentie. De zin die er voor ons toe doet: het semantische model is je voorsprong. AI die je op ruwe tabellen loslaat geeft antwoorden die er goed uitzien. Jouw measures en definities maken ze pas betrouwbaar.","s":"Aan de Microsoft kant legde het Power B I team op eenentwintig juli uit waar Copilot heen gaat. Power B I data kan nu rechtstreeks vragen beantwoorden in Microsoft drie zes vijf Copilot Chat, in preview, en het zwaardere werk in meerdere stappen verhuist naar Copilot Cowork, dat per gebruik wordt afgerekend in plaats van een vaste licentie. De zin die er voor ons toe doet. Het semantische model is je voorsprong. A I die je op ruwe tabellen loslaat geeft antwoorden die er goed uitzien. Jouw measures en definities maken ze pas betrouwbaar."},{"t":"Qua modellen bracht Anthropic op vierentwintig juli Claude Opus 5 uit, de beste in coding en kenniswerk voor ongeveer de helft van de prijs van Fable 5. Moonshot zette op zevenentwintig juli de open weights van Kimi K3 online, het grootste open model tot nu toe. Over fixed price delivery was er deze week niets, dus dat thema sla ik over.","s":"Qua modellen bracht Anthropic op vierentwintig juli Claude Opus vijf uit, de beste in coding en kenniswerk voor ongeveer de helft van de prijs van Fable vijf. Moonshot zette op zevenentwintig juli de open weights van Kimi K drie online, het grootste open model tot nu toe. Over fixed price delivery was er deze week niets, dus dat thema sla ik over."},{"t":"Mijn tip voor de sessie van deze week: Power BI dat vragen beantwoordt in Microsoft 365 Copilot Chat. Het is visueel, je laat het in vijf minuten zien, en het maakt het punt dat het semantische modelwerk dat je BI consultants al doen precies is wat AI betrouwbaar maakt. Fijne week.","s":"Mijn tip voor de sessie van deze week. Power B I dat vragen beantwoordt in Microsoft drie zes vijf Copilot Chat. Het is visueel, je laat het in vijf minuten zien, en het maakt het punt dat het semantische modelwerk dat je B I consultants al doen precies is wat A I betrouwbaar maakt. Fijne week."}],"sources":[{"t":"Azure Databricks release notes, juli 2026","u":"https://learn.microsoft.com/en-us/azure/databricks/release-notes/product/2026/july"},{"t":"Power BI inzichten voor elke Copilot gebruiker","u":"https://community.fabric.microsoft.com/t5/Power-BI-Updates-Blog/Bringing-Power-BI-Insights-to-Every-Copilot-User/ba-p/5309360"},{"t":"Introducing Claude Opus 5","u":"https://www.anthropic.com/news/claude-opus-5"},{"t":"Moonshot onthult Kimi K3, grootste open-weight model","u":"https://www.axios.com/2026/07/16/moonshot-kimi-ai-china-model-openai-anthropic"}]}},{"date":"2026-07-26","label":{"en":"26 July 2026","nl":"26 juli 2026"},"summary":{"en":"Genie gets memory, Cowork learns by watching","nl":"Genie krijgt geheugen, Cowork leert door te kijken"},"en":{"paras":[{"t":"Good morning Ton, here is your Monday AI briefing. The theme this week: the assistants inside your data stack started remembering things, and the cheap tier got a lot cheaper.","s":"Good morning Ton, here is your Monday A I briefing. The theme this week. The assistants inside your data stack started remembering things, and the cheap tier got a lot cheaper."},{"t":"Start with the tools your consultants actually touch. Databricks shipped a real update to Genie One on the sixteenth. It now has memory in beta, so it holds on to your preferences and how you like to work, and applies them next time. It can also search your past conversations and pull that context forward, and you can save any chat thread as a reusable Genie Agent. That last one matters most. It turns a good one off analysis into something the rest of the team can run. Worth telling everyone: Genie One and Genie Agents are free until the thirty first of July, so there are five days left to try it without touching a budget.","s":"Start with the tools your consultants actually touch. Databricks shipped a real update to Genie One on the sixteenth. It now has memory in beta, so it holds on to your preferences and how you like to work, and applies them next time. It can also search your past conversations and pull that context forward, and you can save any chat thread as a reusable Genie Agent. That last one matters most. It turns a good one off analysis into something the rest of the team can run. Worth telling everyone. Genie One and Genie Agents are free until the thirty first of July, so there are five days left to try it without touching a budget."},{"t":"On delivery, Info-Tech published a study this month with a number that should sit uncomfortably with us. Ninety four percent of developers report productivity gains from AI, but governance maturity is lagging well behind adoption. For fixed price work, that gap is the risk. The speed is real, the review and security practice has not caught up, and we are the ones carrying the outcome.","s":"On delivery, Info Tech published a study this month with a number that should sit uncomfortably with us. Ninety four percent of developers report productivity gains from A I, but governance maturity is lagging well behind adoption. For fixed price work, that gap is the risk. The speed is real, the review and security practice has not caught up, and we are the ones carrying the outcome."},{"t":"Also worth knowing, the price floor moved again. Google shipped Gemini 3.6 Flash on the twenty first, cheaper and using about seventeen percent fewer output tokens. DeepSeek V4 went stable on the twenty fourth, and Kimi K3 releases its open weights tomorrow. Routine volume is getting cheap fast, which is good news for anyone owning a fixed price outcome.","s":"Also worth knowing, the price floor moved again. Google shipped Gemini three point six Flash on the twenty first, cheaper and using about seventeen percent fewer output tokens. Deep Seek V four went stable on the twenty fourth, and Kimi K three releases its open weights tomorrow. Routine volume is getting cheap fast, which is good news for anyone owning a fixed price outcome."},{"t":"My pick for this week's session: the new record and teach feature in Claude Cowork. You record yourself doing a task while talking through it, and Claude turns that into a reusable skill. No prompt engineering needed. That is exactly the bridge from enthusiasm to everyday practice we have been looking for. Have a good week.","s":"My pick for this week's session. The new record and teach feature in Claude Cowork. You record yourself doing a task while talking through it, and Claude turns that into a reusable skill. No prompt engineering needed. That is exactly the bridge from enthusiasm to everyday practice we have been looking for. Have a good week."}],"sources":[{"t":"Databricks AI/BI and Genie release notes 2026","u":"https://learn.microsoft.com/en-us/azure/databricks/ai-bi/release-notes/2026"},{"t":"Info-Tech AI in Software Development study","u":"https://www.prnewswire.com/news-releases/94-of-developers-report-ai-productivity-gains-but-governance-maturity-lags-behind-adoption-finds-new-study-from-info-tech-research-group-302829858.html"},{"t":"Google ships Gemini 3.6 Flash","u":"https://www.marktechpost.com/2026/07/21/google-releases-gemini-3-6-flash-3-5-flash-lite-and-3-5-flash-cyber-a-cheaper-more-token-efficient-flash-tier-built-for-agentic-workloads/"},{"t":"AI News, 22 July 2026 (Cowork skills, open weights)","u":"https://www.buildfastwithai.com/blogs/ai-news-today-july-22-2026"}]},"nl":{"paras":[{"t":"Goedemorgen Ton, hier is je maandagbriefing over AI. Het thema van deze week: de assistenten in je datastack zijn dingen gaan onthouden, en de goedkope laag werd een stuk goedkoper.","s":"Goedemorgen Ton, hier is je maandagbriefing over A I. Het thema van deze week. De assistenten in je datastack zijn dingen gaan onthouden, en de goedkope laag werd een stuk goedkoper."},{"t":"Eerst de tools waar je consultants echt mee werken. Databricks bracht op zestien juli een serieuze update van Genie One uit. Er zit nu geheugen in, in beta, dus het onthoudt je voorkeuren en hoe je graag werkt, en past dat de volgende keer toe. Het kan ook je eerdere gesprekken doorzoeken en die context meenemen, en je kunt elke chat opslaan als een herbruikbare Genie Agent. Dat laatste is het interessantst. Daarmee wordt een goede eenmalige analyse iets wat de rest van het team ook kan draaien. Meld dit even aan iedereen: Genie One en Genie Agents zijn gratis tot en met eenendertig juli, dus er zijn nog vijf dagen om het te proberen zonder budget aan te spreken.","s":"Eerst de tools waar je consultants echt mee werken. Databricks bracht op zestien juli een serieuze update van Genie One uit. Er zit nu geheugen in, in beta, dus het onthoudt je voorkeuren en hoe je graag werkt, en past dat de volgende keer toe. Het kan ook je eerdere gesprekken doorzoeken en die context meenemen, en je kunt elke chat opslaan als een herbruikbare Genie Agent. Dat laatste is het interessantst. Daarmee wordt een goede eenmalige analyse iets wat de rest van het team ook kan draaien. Meld dit even aan iedereen. Genie One en Genie Agents zijn gratis tot en met eenendertig juli, dus er zijn nog vijf dagen om het te proberen zonder budget aan te spreken."},{"t":"Over delivery. Info-Tech publiceerde deze maand een onderzoek met een cijfer dat ons ongemakkelijk zou moeten maken. Vierennegentig procent van de ontwikkelaars ziet productiviteitswinst door AI, maar de volwassenheid van governance loopt flink achter op de adoptie. Bij fixed-price werk zit precies daar het risico. De snelheid is echt, de review- en securitypraktijk is nog niet mee, en wij dragen het resultaat.","s":"Over delivery. Info Tech publiceerde deze maand een onderzoek met een cijfer dat ons ongemakkelijk zou moeten maken. Vierennegentig procent van de ontwikkelaars ziet productiviteitswinst door A I, maar de volwassenheid van governance loopt flink achter op de adoptie. Bij fixed price werk zit precies daar het risico. De snelheid is echt, de review en security praktijk is nog niet mee, en wij dragen het resultaat."},{"t":"Ook goed om te weten, de prijsbodem is weer gezakt. Google bracht op eenentwintig juli Gemini 3.6 Flash uit, goedkoper en met ongeveer zeventien procent minder output tokens. DeepSeek V4 werd stabiel op vierentwintig juli, en Kimi K3 geeft morgen zijn open weights vrij. Routinewerk wordt snel goedkoop, en dat is goed nieuws als je een fixed-price resultaat draagt.","s":"Ook goed om te weten, de prijsbodem is weer gezakt. Google bracht op eenentwintig juli Gemini drie punt zes Flash uit, goedkoper en met ongeveer zeventien procent minder output tokens. Deep Seek V vier werd stabiel op vierentwintig juli, en Kimi K drie geeft morgen zijn open weights vrij. Routinewerk wordt snel goedkoop, en dat is goed nieuws als je een fixed price resultaat draagt."},{"t":"Mijn tip voor de sessie van deze week: de nieuwe opnamefunctie van Claude Cowork. Je neemt jezelf op terwijl je een taak doet en hardop uitlegt wat je doet, en Claude maakt daar een herbruikbare skill van. Geen prompt engineering nodig. Dat is precies de brug van enthousiasme naar dagelijkse praktijk die we zoeken. Fijne week.","s":"Mijn tip voor de sessie van deze week. De nieuwe opnamefunctie van Claude Cowork. Je neemt jezelf op terwijl je een taak doet en hardop uitlegt wat je doet, en Claude maakt daar een herbruikbare skill van. Geen prompt engineering nodig. Dat is precies de brug van enthousiasme naar dagelijkse praktijk die we zoeken. Fijne week."}],"sources":[{"t":"Databricks AI/BI en Genie release notes 2026","u":"https://learn.microsoft.com/en-us/azure/databricks/ai-bi/release-notes/2026"},{"t":"Info-Tech onderzoek AI in softwareontwikkeling","u":"https://www.prnewswire.com/news-releases/94-of-developers-report-ai-productivity-gains-but-governance-maturity-lags-behind-adoption-finds-new-study-from-info-tech-research-group-302829858.html"},{"t":"Google brengt Gemini 3.6 Flash uit","u":"https://www.marktechpost.com/2026/07/21/google-releases-gemini-3-6-flash-3-5-flash-lite-and-3-5-flash-cyber-a-cheaper-more-token-efficient-flash-tier-built-for-agentic-workloads/"},{"t":"AI Nieuws, 22 juli 2026 (Cowork skills, open weights)","u":"https://www.buildfastwithai.com/blogs/ai-news-today-july-22-2026"}]}},{"date":"2026-07-03","label":{"en":"3 July 2026","nl":"3 juli 2026"},"summary":{"en":"Agentic AI becomes an actual coworker","nl":"Agentic AI wordt een echte collega"},"en":{"paras":[{"t":"Good morning Ton, here is your Monday AI briefing. Big theme this week: agentic AI moved from chat window into an actual coworker, one that creates documents and runs actions on its own.","s":"Good morning Ton, here is your Monday A I briefing. Big theme this week. Agentic A I moved from chat window into an actual coworker, one that creates documents and runs actions on its own."},{"t":"For our Data Engineers, BI Consultants and Business Analysts: Microsoft rolled out Agent Skills for Power BI, letting you prompt an agent to build and refine semantic models and reports, plus a new Copilot in web modeling that improves models using plain language. Google Looker got its own BI Agents, conversational agents that query complex data models in plain English and plug straight into workspace tools. And Databricks launched Genie One at its Data and AI Summit, a data smart AI coworker that goes beyond answering questions. It creates documents straight from live data computation instead of static snapshots, and it executes actions through MCP tools, like updating a Jira ticket on its own.","s":"For our Data Engineers, B I Consultants and Business Analysts. Microsoft rolled out Agent Skills for Power B I, letting you prompt an agent to build and refine semantic models and reports, plus a new Copilot in web modeling that improves models using plain language. Google Looker got its own B I Agents, conversational agents that query complex data models in plain English and plug straight into workspace tools. And Databricks launched Genie One at its Data and A I Summit, a data smart A I coworker that goes beyond answering questions. It creates documents straight from live data computation instead of static snapshots, and it executes actions through M C P tools, like updating a Jira ticket on its own."},{"t":"On the delivery and consulting side, this one matters for where we're headed. Microsoft just created Frontier Company, a two and a half billion dollar unit with six thousand people whose only job is deploying enterprise AI for clients. That is basically what our AI driven fixed price ambition is racing against. New engineering benchmarks also show lower performing teams cut their lead time to value nearly in half once they properly adopted AI, while stronger teams saw smaller gains, so the biggest upside sits exactly where our supplier teams need to close gaps.","s":"On the delivery and consulting side, this one matters for where we're headed. Microsoft just created Frontier Company, a two and a half billion dollar unit with six thousand people whose only job is deploying enterprise A I for clients. That is basically what our A I driven fixed price ambition is racing against. New engineering benchmarks also show lower performing teams cut their lead time to value nearly in half once they properly adopted A I, while stronger teams saw smaller gains, so the biggest upside sits exactly where our supplier teams need to close gaps."},{"t":"Anthropic also shipped Claude Sonnet 5 this Monday, its most agentic Sonnet yet, with a million token context window and real autonomous tool use right inside Cowork.","s":"Anthropic also shipped Claude Sonnet five this Monday, its most agentic Sonnet yet, with a million token context window and real autonomous tool use right inside Cowork."},{"t":"My pick for this week's session: demo Databricks Genie One's live document creation and its Jira action. In five minutes it shows the room what an AI coworker actually does beyond chat, and that is exactly the story we're trying to tell.","s":"My pick for this week's session. Demo Databricks Genie One's live document creation and its Jira action. In five minutes it shows the room what an A I coworker actually does beyond chat, and that is exactly the story we're trying to tell."}],"sources":[{"t":"Power BI Agent Skills","u":"https://releasebot.io/updates/microsoft/power-bi"},{"t":"Looker BI Agents","u":"https://cloud.google.com/blog/products/business-intelligence/looker-in-2026-gartner-analytics-and-bi-platforms-mq"},{"t":"Databricks Genie One","u":"https://www.flexera.com/blog/perspectives/databricks-data-ai-summit-2026/"},{"t":"Microsoft Frontier Company","u":"https://creati.ai/ai-news/2026-07-02/microsoft-creates-frontier-company-a-2-5-billion-enterprise-ai-deployment-unit-with-6000-experts/"},{"t":"2026 Engineering Productivity Benchmarks","u":"https://plandek.com/blog/what-ai-is-really-changing-in-software-delivery"},{"t":"Claude Sonnet 5","u":"https://simonwillison.net/2026/Jun/30/claude-sonnet-5/"}]},"nl":{"paras":[{"t":"Goedemorgen Ton, hier is je maandagbriefing over AI. Het grote thema deze week: agentic AI is van het chatvenster naar een echte collega gegaan, eentje die zelf documenten maakt en acties uitvoert.","s":"Goedemorgen Ton, hier is je maandagbriefing over A I. Het grote thema deze week. Agentic A I is van het chatvenster naar een echte collega gegaan, eentje die zelf documenten maakt en acties uitvoert."},{"t":"Voor onze Data Engineers, BI Consultants en Business Analisten: Microsoft heeft Agent Skills voor Power BI uitgerold, waarmee je een agent kunt vragen semantische modellen en rapporten te bouwen en te verbeteren, plus een nieuwe Copilot in web modeling die modellen verbetert met gewone taal. Google Looker kreeg eigen BI Agents, conversationele agents die complexe datamodellen in gewone taal bevragen en direct aansluiten op workspace tools. En Databricks lanceerde Genie One op de Data and AI Summit, een datavaardige AI collega die verder gaat dan vragen beantwoorden. Het maakt documenten rechtstreeks uit live berekeningen in plaats van statische snapshots, en voert acties uit via MCP tools, zoals zelf een Jira ticket bijwerken.","s":"Voor onze Data Engineers, B I Consultants en Business Analisten. Microsoft heeft Agent Skills voor Power B I uitgerold, waarmee je een agent kunt vragen semantische modellen en rapporten te bouwen en te verbeteren, plus een nieuwe Copilot in web modeling die modellen verbetert met gewone taal. Google Looker kreeg eigen B I Agents, conversationele agents die complexe datamodellen in gewone taal bevragen en direct aansluiten op workspace tools. En Databricks lanceerde Genie One op de Data and A I Summit, een datavaardige A I collega die verder gaat dan vragen beantwoorden. Het maakt documenten rechtstreeks uit live berekeningen in plaats van statische snapshots, en voert acties uit via M C P tools, zoals zelf een Jira ticket bijwerken."},{"t":"Dan de delivery- en consultingkant, en die raakt precies waar wij heen gaan. Microsoft heeft Frontier Company opgericht, een unit van tweeëneenhalf miljard dollar met zesduizend mensen die alleen maar enterprise AI bij klanten uitrolt. Dat is in feite waar onze AI-gedreven fixed-price ambitie tegen opbokst. Nieuwe engineering benchmarks laten ook zien dat zwakker presterende teams hun lead time to value bijna halveerden zodra ze AI echt adopteerden, terwijl sterkere teams kleinere winst zagen. De grootste winst zit dus precies daar waar onze supplier teams gaten moeten dichten.","s":"Dan de delivery en consulting kant, en die raakt precies waar wij heen gaan. Microsoft heeft Frontier Company opgericht, een unit van tweeëneenhalf miljard dollar met zesduizend mensen die alleen maar enterprise A I bij klanten uitrolt. Dat is in feite waar onze A I gedreven fixed price ambitie tegen opbokst. Nieuwe engineering benchmarks laten ook zien dat zwakker presterende teams hun lead time to value bijna halveerden zodra ze A I echt adopteerden, terwijl sterkere teams kleinere winst zagen. De grootste winst zit dus precies daar waar onze supplier teams gaten moeten dichten."},{"t":"Anthropic bracht deze maandag ook Claude Sonnet 5 uit, de meest agentic Sonnet tot nu toe, met een contextvenster van een miljoen tokens en echt autonoom gebruik van tools binnen Cowork.","s":"Anthropic bracht deze maandag ook Claude Sonnet vijf uit, de meest agentic Sonnet tot nu toe, met een contextvenster van een miljoen tokens en echt autonoom gebruik van tools binnen Cowork."},{"t":"Mijn tip voor de sessie van deze week: demo de live documentcreatie van Databricks Genie One en de Jira actie. In vijf minuten zie je wat een AI collega echt doet buiten chat om, en dat is precies het verhaal dat we willen vertellen.","s":"Mijn tip voor de sessie van deze week. Demo de live documentcreatie van Databricks Genie One en de Jira actie. In vijf minuten zie je wat een A I collega echt doet buiten chat om, en dat is precies het verhaal dat we willen vertellen."}],"sources":[{"t":"Power BI Agent Skills","u":"https://releasebot.io/updates/microsoft/power-bi"},{"t":"Looker BI Agents","u":"https://cloud.google.com/blog/products/business-intelligence/looker-in-2026-gartner-analytics-and-bi-platforms-mq"},{"t":"Databricks Genie One","u":"https://www.flexera.com/blog/perspectives/databricks-data-ai-summit-2026/"},{"t":"Microsoft Frontier Company","u":"https://creati.ai/ai-news/2026-07-02/microsoft-creates-frontier-company-a-2-5-billion-enterprise-ai-deployment-unit-with-6000-experts/"},{"t":"2026 Engineering Productivity Benchmarks","u":"https://plandek.com/blog/what-ai-is-really-changing-in-software-delivery"},{"t":"Claude Sonnet 5","u":"https://simonwillison.net/2026/Jun/30/claude-sonnet-5/"}]}},{"date":"2026-06-11","label":{"en":"11 June 2026","nl":"11 juni 2026"},"summary":{"en":"Data tools quietly becoming agents","nl":"Datatools worden stilletjes agents"},"en":{"paras":[{"t":"Good morning Ton, here is your Monday AI briefing. This week the big theme is that your data tools are quietly turning into agents, and the consulting world is starting to sweat about what that means for billable hours.","s":"Good morning Ton, here is your Monday A I briefing. This week the big theme is that your data tools are quietly turning into agents, and the consulting world is starting to sweat about what that means for billable hours."},{"t":"Start with the practical stuff for your teams. Databricks shipped a wave of updates to Genie this month. The headline one is Genie Ontology, which automatically builds a map of your business by reading your existing dashboards, notebooks and pipelines, so the answers get sharper without anyone hand feeding it context. Even better for your BI people, you can now drop a Tableau or Power BI file straight into Genie and it rebuilds the dashboard for you. Microsoft also pushed its June Power BI and Fabric update, including Fabric Apps, an AI first way to build data apps straight on top of your semantic models. Both of these mean less plumbing, more answering questions.","s":"Start with the practical stuff for your teams. Databricks shipped a wave of updates to Genie this month. The headline one is Genie Ontology, which automatically builds a map of your business by reading your existing dashboards, notebooks and pipelines, so the answers get sharper without anyone hand feeding it context. Even better for your B I people, you can now drop a Tableau or Power B I file straight into Genie and it rebuilds the dashboard for you. Microsoft also pushed its June Power B I and Fabric update, including Fabric Apps, an A I first way to build data apps straight on top of your semantic models. Both of these mean less plumbing, more answering questions."},{"t":"Now the delivery and consulting angle, which is right in your lane. A fresh 2026 consulting review made a sharp point. AI already makes consultants far more productive, but firms are slow to deploy it fully because it shrinks the billable hours they sell. That is exactly the tension your fixed price AI delivery model sidesteps. When you own the outcome, not the hours, productivity becomes your margin, not your enemy. Worth saying out loud to your teams.","s":"Now the delivery and consulting angle, which is right in your lane. A fresh twenty twenty six consulting review made a sharp point. A I already makes consultants far more productive, but firms are slow to deploy it fully because it shrinks the billable hours they sell. That is exactly the tension your fixed price A I delivery model sidesteps. When you own the outcome, not the hours, productivity becomes your margin, not your enemy. Worth saying out loud to your teams."},{"t":"For something a colleague can actually demo, Alteryx just previewed Agent Studio, which turns an existing data workflow into an autonomous agent without writing code. Very visual, very on theme for the session.","s":"For something a colleague can actually demo, Alteryx just previewed Agent Studio, which turns an existing data workflow into an autonomous agent without writing code. Very visual, very on theme for the session."},{"t":"My recommendation. Demo the Databricks Genie trick of importing a Power BI file and then chatting with it in plain language. It is live, it is visual, and every data consultant in the room will instantly see the time it saves. Have a good week.","s":"My recommendation. Demo the Databricks Genie trick of importing a Power B I file and then chatting with it in plain language. It is live, it is visual, and every data consultant in the room will instantly see the time it saves. Have a good week."}],"sources":[{"t":"Databricks AI/BI and Genie release notes 2026","u":"https://learn.microsoft.com/en-us/azure/databricks/ai-bi/release-notes/2026"},{"t":"Power BI June 2026 Feature Summary","u":"https://community.fabric.microsoft.com/t5/Power-BI-Updates-Blog/Power-BI-June-2026-Feature-Summary/ba-p/5193264"},{"t":"Future of Consulting: 2026 AI Revolution Update","u":"https://futureofconsulting.ai/ai-leadership/2026-consultings-ai-revolution-update/"},{"t":"Alteryx Agent Studio at Inspire 2026","u":"https://enterprisedna.co/resources/news/alteryx-agent-studio-inspire-2026-analytics-ai-agents/"}]},"nl":{"paras":[{"t":"Goedemorgen Ton, hier is je maandagbriefing over AI. Het grote thema deze week is dat je datatools stilletjes agents aan het worden zijn, en dat de consultingwereld begint te zweten over wat dat betekent voor declarabele uren.","s":"Goedemorgen Ton, hier is je maandagbriefing over A I. Het grote thema deze week is dat je datatools stilletjes agents aan het worden zijn, en dat de consultingwereld begint te zweten over wat dat betekent voor declarabele uren."},{"t":"Eerst het praktische voor je teams. Databricks bracht deze maand een golf aan Genie updates uit. De belangrijkste is Genie Ontology, dat automatisch een kaart van je business bouwt door je bestaande dashboards, notebooks en pipelines te lezen. Daardoor worden de antwoorden scherper zonder dat iemand handmatig context hoeft te voeren. Nog mooier voor je BI mensen: je kunt nu een Tableau of Power BI bestand zo in Genie gooien en het bouwt het dashboard voor je opnieuw op. Microsoft bracht ook de juni update van Power BI en Fabric uit, inclusief Fabric Apps, een AI-first manier om data apps direct op je semantische modellen te bouwen. Beide betekenen minder leidingwerk en meer vragen beantwoorden.","s":"Eerst het praktische voor je teams. Databricks bracht deze maand een golf aan Genie updates uit. De belangrijkste is Genie Ontology, dat automatisch een kaart van je business bouwt door je bestaande dashboards, notebooks en pipelines te lezen. Daardoor worden de antwoorden scherper zonder dat iemand handmatig context hoeft te voeren. Nog mooier voor je B I mensen. Je kunt nu een Tableau of Power B I bestand zo in Genie gooien en het bouwt het dashboard voor je opnieuw op. Microsoft bracht ook de juni update van Power B I en Fabric uit, inclusief Fabric Apps, een A I first manier om data apps direct op je semantische modellen te bouwen. Beide betekenen minder leidingwerk en meer vragen beantwoorden."},{"t":"Dan de delivery- en consultinghoek, en die ligt precies in jouw straatje. Een recent consultingoverzicht van 2026 maakte een scherp punt. AI maakt consultants nu al veel productiever, maar bureaus rollen het traag uit omdat het de declarabele uren die ze verkopen kleiner maakt. Dat is precies de spanning die jouw fixed-price AI deliverymodel omzeilt. Als je het resultaat bezit en niet de uren, dan wordt productiviteit je marge en niet je vijand. Het waard om hardop tegen je teams te zeggen.","s":"Dan de delivery en consulting hoek, en die ligt precies in jouw straatje. Een recent consulting overzicht van twintig zesentwintig maakte een scherp punt. A I maakt consultants nu al veel productiever, maar bureaus rollen het traag uit omdat het de declarabele uren die ze verkopen kleiner maakt. Dat is precies de spanning die jouw fixed price A I deliverymodel omzeilt. Als je het resultaat bezit en niet de uren, dan wordt productiviteit je marge en niet je vijand. Het waard om hardop tegen je teams te zeggen."},{"t":"En iets wat een collega echt kan demonstreren: Alteryx toonde een preview van Agent Studio, dat een bestaande data workflow omzet in een autonome agent zonder code te schrijven. Erg visueel en helemaal in lijn met het thema van de sessie.","s":"En iets wat een collega echt kan demonstreren. Alteryx toonde een preview van Agent Studio, dat een bestaande data workflow omzet in een autonome agent zonder code te schrijven. Erg visueel en helemaal in lijn met het thema van de sessie."},{"t":"Mijn aanbeveling. Demo de Databricks Genie truc: importeer een Power BI bestand en ga er daarna in gewone taal mee in gesprek. Het is live, het is visueel, en elke data consultant in de zaal ziet meteen hoeveel tijd het scheelt. Fijne week.","s":"Mijn aanbeveling. Demo de Databricks Genie truc. Importeer een Power B I bestand en ga er daarna in gewone taal mee in gesprek. Het is live, het is visueel, en elke data consultant in de zaal ziet meteen hoeveel tijd het scheelt. Fijne week."}],"sources":[{"t":"Databricks AI/BI en Genie release notes 2026","u":"https://learn.microsoft.com/en-us/azure/databricks/ai-bi/release-notes/2026"},{"t":"Power BI juni 2026 Feature Summary","u":"https://community.fabric.microsoft.com/t5/Power-BI-Updates-Blog/Power-BI-June-2026-Feature-Summary/ba-p/5193264"},{"t":"Future of Consulting: 2026 AI Revolution Update","u":"https://futureofconsulting.ai/ai-leadership/2026-consultings-ai-revolution-update/"},{"t":"Alteryx Agent Studio op Inspire 2026","u":"https://enterprisedna.co/resources/news/alteryx-agent-studio-inspire-2026-analytics-ai-agents/"}]}},{"date":"2026-09-06","label":{"en":"6 September 2026","nl":"6 september 2026"},"summary":{"en":"Four frontier launches, Iceberg v3 GA","nl":"Vier frontier launches, Iceberg v3 beschikbaar"},"sections":[{"id":"generic","title":{"en":"General AI news","nl":"Algemeen AI nieuws"},"en":{"paras":[{"t":"Good morning. This is your weekly AI briefing for the EPAM Data community. This week, four frontier model launches in three days, and a reminder that the EU AI Act has not gone quiet.","s":"Good morning. This is your weekly A I briefing for the Epam Data community. This week, four frontier model launches in three days, and a reminder that the E U A I Act has not gone quiet."},{"t":"The first week of September was dense. Anthropic shipped Claude Fable 5.1 and Mythos 5.1 on the first. Google followed with Gemini 3.8 Flash on the second. OpenAI released GPT-6 Astra on the third. Meta added Muse Spark 1.3 that same evening. Astra is the first model to trigger its own critical cyber safeguard threshold, so the strongest variants ship behind gated access.","s":"The first week of September was dense. Anthropic shipped Claude Fable five point one and Mythos five point one on the first. Google followed with Gemini three point eight Flash on the second. OpenAI released G P T six Astra on the third. Meta added Muse Spark one point three that same evening. Astra is the first model to trigger its own critical cyber safeguard threshold, so the strongest variants ship behind gated access."},{"t":"Two things matter more than the version numbers. First, the gains are coming from post training environment scaling, not from new base architectures. Second, these models reach your platform within days. Databricks already hosts both Gemini 3.8 Flash and Claude Fable 5.1 as models of its own. So the practical question is not who wins the benchmark. It is whether your platform lets you swap the model per task without rewriting anything around it.","s":"Two things matter more than the version numbers. First, the gains are coming from post training environment scaling, not from new base architectures. Second, these models reach your platform within days. Databricks already hosts both Gemini three point eight Flash and Claude Fable five point one as models of its own. So the practical question is not who wins the benchmark. It is whether your platform lets you swap the model per task without rewriting anything around it."},{"t":"On regulation, do not relax. The high risk deadline moved to December 2027 under the Digital Omnibus. But the Article 50 transparency and AI content labelling duties have applied since the second of August, and they did not move. The deferral bought you time on paperwork, not on transparency. If you build something that talks to people, it has to say what it is.","s":"On regulation, do not relax. The high risk deadline moved to December twenty twenty seven under the Digital Omnibus. But the Article fifty transparency and A I content labelling duties have applied since the second of August, and they did not move. The deferral bought you time on paperwork, not on transparency. If you build something that talks to people, it has to say what it is."}],"sources":[{"t":"AI model releases, September 2026 tracker","u":"https://www.digitalapplied.com/blog/ai-model-releases-september-2026-tracker"},{"t":"Databricks release notes, September 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/september"},{"t":"EU AI Act implementation timeline","u":"https://artificialintelligenceact.eu/implementation-timeline/"}]},"nl":{"paras":[{"t":"Goedemorgen. Dit is je wekelijkse AI briefing voor de EPAM Data community. Deze week vier frontier modellen in drie dagen, en een herinnering dat de EU AI Act niet stil is gevallen.","s":"Goedemorgen. Dit is je wekelijkse A I briefing voor de Epam Data community. Deze week vier frontier modellen in drie dagen, en een herinnering dat de E U A I Act niet stil is gevallen."},{"t":"De eerste week van september was druk. Anthropic bracht op 1 september Claude Fable 5.1 en Mythos 5.1 uit. Google volgde een dag later met Gemini 3.8 Flash. Op 3 september kwam OpenAI met GPT-6 Astra. Meta zette die avond Muse Spark 1.3 erbij. Astra is het eerste model dat zijn eigen critical cyber drempel raakte, dus de sterkste varianten zitten achter een toegangspoort.","s":"De eerste week van september was druk. Anthropic bracht op een september Claude Fable vijf punt een en Mythos vijf punt een uit. Google volgde een dag later met Gemini drie punt acht Flash. Op drie september kwam OpenAI met G P T zes Astra. Meta zette die avond Muse Spark een punt drie erbij. Astra is het eerste model dat zijn eigen critical cyber drempel raakte, dus de sterkste varianten zitten achter een toegangspoort."},{"t":"Twee dingen zijn belangrijker dan de versienummers. De winst komt uit post training environment scaling, dus niet uit nieuwe architecturen. En die modellen staan binnen dagen op je platform. Databricks host Gemini 3.8 Flash en Claude Fable 5.1 inmiddels gewoon zelf. De praktische vraag is dus niet wie de benchmark wint. Het gaat erom of je platform je per taak een ander model laat kiezen, zonder dat je er iets voor hoeft te herschrijven.","s":"Twee dingen zijn belangrijker dan de versienummers. De winst komt uit post training environment scaling, dus niet uit nieuwe architecturen. En die modellen staan binnen dagen op je platform. Databricks host Gemini drie punt acht Flash en Claude Fable vijf punt een inmiddels gewoon zelf. De praktische vraag is dus niet wie de benchmark wint. Het gaat erom of je platform je per taak een ander model laat kiezen, zonder dat je er iets voor hoeft te herschrijven."},{"t":"Over regelgeving. Achteroverleunen is geen optie. De deadline voor hoog risico systemen schoof onder de Digital Omnibus door naar december 2027. Maar de transparantieplicht uit artikel 50 geldt sinds 2 augustus, en die is niet verschoven. Het uitstel gaf je lucht op papierwerk, niet op transparantie. Bouw je iets dat met mensen praat? Dan moet het zeggen wat het is.","s":"Over regelgeving. Achteroverleunen is geen optie. De deadline voor hoog risico systemen schoof onder de Digital Omnibus door naar december tweeduizend zevenentwintig. Maar de transparantieplicht uit artikel vijftig geldt sinds twee augustus, en die is niet verschoven. Het uitstel gaf je lucht op papierwerk, niet op transparantie. Bouw je iets dat met mensen praat? Dan moet het zeggen wat het is."}],"sources":[{"t":"AI model releases, September 2026 tracker","u":"https://www.digitalapplied.com/blog/ai-model-releases-september-2026-tracker"},{"t":"Databricks release notes, September 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/september"},{"t":"EU AI Act implementation timeline","u":"https://artificialintelligenceact.eu/implementation-timeline/"}]}},{"id":"governance","title":{"en":"Data Governance","nl":"Data Governance"},"en":{"paras":[{"t":"Data Governance Consultants. Snowflake made external lineage generally available on the third of September. Your lineage graph now reaches past Snowflake's own walls, into the systems upstream and downstream. If you have ever had to write lineage unknown in a report, this is the fix."},{"t":"One day later, Snowflake made the prompt injection guardrails in Cortex AI Guardrails available inside the cross region settings for the EU, Japan and APJ. That matters for residency. Until now, European clients often had to choose between having guardrails and keeping processing inside Europe. That trade is gone.","s":"One day later, Snowflake made the prompt injection guardrails in Cortex A I Guardrails available inside the cross region settings for the E U, Japan and A P J. That matters for residency. Until now, European clients often had to choose between having guardrails and keeping processing inside Europe. That trade is gone."},{"t":"Databricks made ABAC GRANT policies generally available for models, model serving, MCP services and agent services. So attribute based access control now covers the agent, not only the table it reads. You write the rule once, and it holds the moment someone points an agent at your data. Start with the agents that already exist in your estate, because those are the ones nobody has inventoried.","s":"Databricks made A B A C GRANT policies generally available for models, model serving, M C P services and agent services. So attribute based access control now covers the agent, not only the table it reads. You write the rule once, and it holds the moment someone points an agent at your data. Start with the agents that already exist in your estate, because those are the ones nobody has inventoried."}],"sources":[{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"},{"t":"Databricks release notes, September 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/september"},{"t":"EU AI Act implementation timeline","u":"https://artificialintelligenceact.eu/implementation-timeline/"}]},"nl":{"paras":[{"t":"Data Governance Consultants. Sinds 3 september is external lineage bij Snowflake algemeen beschikbaar. Je lineage graaf loopt nu door tot buiten Snowflake zelf, naar de systemen ervoor en erna. Heb je ooit lineage onbekend in een rapport moeten zetten? Dit is de oplossing.","s":"Data Governance Consultants. Sinds drie september is external lineage bij Snowflake algemeen beschikbaar. Je lineage graaf loopt nu door tot buiten Snowflake zelf, naar de systemen ervoor en erna. Heb je ooit lineage onbekend in een rapport moeten zetten? Dit is de oplossing."},{"t":"Een dag later kwamen de prompt injection guardrails in Cortex AI Guardrails beschikbaar binnen de cross region instellingen voor de EU, Japan en APJ. Dat telt voor residency. Tot nu toe moesten Europese klanten vaak kiezen tussen guardrails en verwerking binnen Europa houden. Die keuze is weg.","s":"Een dag later kwamen de prompt injection guardrails in Cortex A I Guardrails beschikbaar binnen de cross region instellingen voor de E U, Japan en A P J. Dat telt voor residency. Tot nu toe moesten Europese klanten vaak kiezen tussen guardrails en verwerking binnen Europa houden. Die keuze is weg."},{"t":"Bij Databricks zijn ABAC GRANT policies algemeen beschikbaar voor models, model serving, MCP services en agent services. Attribute based access control dekt dus de agent, niet alleen de tabel die hij leest. Je schrijft de regel één keer, en hij houdt stand zodra iemand een agent op je data zet. Begin bij de agents die er al zijn, want die heeft nog niemand in kaart gebracht.","s":"Bij Databricks zijn A B A C GRANT policies algemeen beschikbaar voor models, model serving, M C P services en agent services. Attribute based access control dekt dus de agent, niet alleen de tabel die hij leest. Je schrijft de regel één keer, en hij houdt stand zodra iemand een agent op je data zet. Begin bij de agents die er al zijn, want die heeft nog niemand in kaart gebracht."}],"sources":[{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"},{"t":"Databricks release notes, September 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/september"},{"t":"EU AI Act implementation timeline","u":"https://artificialintelligenceact.eu/implementation-timeline/"}]}},{"id":"engineering","title":{"en":"Data Engineers","nl":"Data Engineers"},"en":{"paras":[{"t":"Data Engineers. Start with the one that can break your build. Snowflake raises the default column size for string and binary types this month. dbt-snowflake below version 1.10.6 can fail to build certain incremental models when that lands. Check your version this week, not next.","s":"Data Engineers. Start with the one that can break your build. Snowflake raises the default column size for string and binary types this month. d b t snowflake below version one point ten point six can fail to build certain incremental models when that lands. Check your version this week, not next."},{"t":"Also from the first of September, new dbt projects default to Fusion Stable. That applies to trial, starter and Enterprise accounts on Redshift, Snowflake, BigQuery and Databricks. Fusion is the default now, not the experiment. One catch. The Model Timing tab shows a banner instead of the chart for Fusion runs, because threading works differently.","s":"Also from the first of September, new d b t projects default to Fusion Stable. That applies to trial, starter and Enterprise accounts on Redshift, Snowflake, BigQuery and Databricks. Fusion is the default now, not the experiment. One catch. The Model Timing tab shows a banner instead of the chart for Fusion runs, because threading works differently."},{"t":"On Databricks, Apache Arrow support for Zerobus Ingest in Lakeflow Connect went generally available, so streaming ingestion gets a columnar path from end to end. And Git Folder Serverless is in beta. It lets you share serverless compute and one pyproject.toml across every notebook and file in a Git folder. That kills a lot of environment drift.","s":"On Databricks, Apache Arrow support for Zerobus Ingest in Lakeflow Connect went generally available, so streaming ingestion gets a columnar path from end to end. And Git Folder Serverless is in beta. It lets you share serverless compute and one pyproject dot toml across every notebook and file in a Git folder. That kills a lot of environment drift."}],"sources":[{"t":"dbt release notes","u":"https://docs.getdbt.com/docs/dbt-versions/release-notes"},{"t":"Databricks release notes, September 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/september"},{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"}]},"nl":{"paras":[{"t":"Data Engineers. Eerst het ding dat je build kan slopen. Snowflake verhoogt deze maand de standaard kolomgrootte voor string en binary types. dbt-snowflake onder versie 1.10.6 kan daardoor bepaalde incremental models niet meer bouwen. Check je versie deze week, niet volgende week.","s":"Data Engineers. Eerst het ding dat je build kan slopen. Snowflake verhoogt deze maand de standaard kolomgrootte voor string en binary types. d b t snowflake onder versie een punt tien punt zes kan daardoor bepaalde incremental models niet meer bouwen. Check je versie deze week, niet volgende week."},{"t":"Verder gaan nieuwe dbt projecten sinds 1 september standaard op Fusion Stable. Dat geldt op trial, starter en Enterprise accounts, met Redshift, Snowflake, BigQuery en Databricks. Fusion is dus de standaard, geen experiment meer. Eén ding. De Model Timing tab laat bij Fusion runs een melding zien in plaats van de grafiek, want de threading werkt anders.","s":"Verder gaan nieuwe d b t projecten sinds een september standaard op Fusion Stable. Dat geldt op trial, starter en Enterprise accounts, met Redshift, Snowflake, BigQuery en Databricks. Fusion is dus de standaard, geen experiment meer. Eén ding. De Model Timing tab laat bij Fusion runs een melding zien in plaats van de grafiek, want de threading werkt anders."},{"t":"Bij Databricks is Apache Arrow support voor Zerobus Ingest in Lakeflow Connect algemeen beschikbaar. Je streaming ingestie krijgt dus van begin tot eind een kolomgebaseerd pad. En Git Folder Serverless staat in beta. Daarmee deel je serverless compute en één pyproject.toml over alle notebooks en files in een Git folder. Dat scheelt een hoop environment drift.","s":"Bij Databricks is Apache Arrow support voor Zerobus Ingest in Lakeflow Connect algemeen beschikbaar. Je streaming ingestie krijgt dus van begin tot eind een kolomgebaseerd pad. En Git Folder Serverless staat in beta. Daarmee deel je serverless compute en één pyproject dot toml over alle notebooks en files in een Git folder. Dat scheelt een hoop environment drift."}],"sources":[{"t":"dbt release notes","u":"https://docs.getdbt.com/docs/dbt-versions/release-notes"},{"t":"Databricks release notes, September 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/september"},{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"}]}},{"id":"bi","title":{"en":"BI Consultants","nl":"BI Consultants"},"en":{"paras":[{"t":"BI Consultants. Genie One can now search the public web when a question needs current information, and it cites the external sources as links in the answer. So a question about a recent release note or a third party doc no longer dead ends. Do watch which sources it picks, because your users can see them too.","s":"B I Consultants. Genie One can now search the public web when a question needs current information, and it cites the external sources as links in the answer. So a question about a recent release note or a third party doc no longer dead ends. Do watch which sources it picks, because your users can see them too."},{"t":"Two more from Databricks. Genie Code scheduled tasks are generally available. And the embedded dashboard filter APIs let you set and read filter values from outside the dashboard. That is exactly what you need when the dashboard lives inside somebody else's application.","s":"Two more from Databricks. Genie Code scheduled tasks are generally available. And the embedded dashboard filter A P I s let you set and read filter values from outside the dashboard. That is exactly what you need when the dashboard lives inside somebody else's application."},{"t":"In Power BI, a small change with wide reach. All font overrides are gone from the base theme, so changing a font in one place now updates titles, callouts, labels and general text everywhere. And there is a hard date. From October, Power BI Desktop from March 2026 or earlier can no longer save and share to OneDrive and SharePoint. Update before somebody finds out on a Monday.","s":"In Power B I, a small change with wide reach. All font overrides are gone from the base theme, so changing a font in one place now updates titles, callouts, labels and general text everywhere. And there is a hard date. From October, Power B I Desktop from March twenty twenty six or earlier can no longer save and share to OneDrive and SharePoint. Update before somebody finds out on a Monday."}],"sources":[{"t":"AI/BI and Genie One release notes 2026","u":"https://learn.microsoft.com/en-us/azure/databricks/ai-bi/release-notes/2026"},{"t":"Power BI August 2026 feature summary","u":"https://community.fabric.microsoft.com/blog/fbc_pbiupdatesblog/power-bi-august-2026-feature-summary/5348434"},{"t":"Databricks release notes, September 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/september"}]},"nl":{"paras":[{"t":"BI Consultants. Genie One kan nu het open web doorzoeken als een vraag actuele informatie nodig heeft, en zet de externe bronnen als links in het antwoord. Een vraag over een recente release note of documentatie van derden loopt dus niet meer dood. Let wel op welke bronnen hij kiest, want je gebruikers zien ze nu ook.","s":"B I Consultants. Genie One kan nu het open web doorzoeken als een vraag actuele informatie nodig heeft, en zet de externe bronnen als links in het antwoord. Een vraag over een recente release note of documentatie van derden loopt dus niet meer dood. Let wel op welke bronnen hij kiest, want je gebruikers zien ze nu ook."},{"t":"Nog twee dingen van Databricks. Genie Code scheduled tasks zijn algemeen beschikbaar. En met de embedded dashboard filter APIs zet en lees je filterwaarden van buitenaf. Precies wat je nodig hebt als het dashboard in de applicatie van iemand anders draait.","s":"Nog twee dingen van Databricks. Genie Code scheduled tasks zijn algemeen beschikbaar. En met de embedded dashboard filter A P I s zet en lees je filterwaarden van buitenaf. Precies wat je nodig hebt als het dashboard in de applicatie van iemand anders draait."},{"t":"In Power BI een kleine wijziging met veel bereik. Alle font overrides zijn uit het basis thema gehaald, dus één font aanpassen werkt nu door in titels, callouts, labels en gewone tekst. En er is een harde datum. Vanaf oktober kan Power BI Desktop van maart 2026 of ouder niet meer opslaan en delen naar OneDrive en SharePoint. Update voordat iemand daar op maandag achter komt.","s":"In Power B I een kleine wijziging met veel bereik. Alle font overrides zijn uit het basis thema gehaald, dus één font aanpassen werkt nu door in titels, callouts, labels en gewone tekst. En er is een harde datum. Vanaf oktober kan Power B I Desktop van maart tweeduizend zesentwintig of ouder niet meer opslaan en delen naar OneDrive en SharePoint. Update voordat iemand daar op maandag achter komt."}],"sources":[{"t":"AI/BI and Genie One release notes 2026","u":"https://learn.microsoft.com/en-us/azure/databricks/ai-bi/release-notes/2026"},{"t":"Power BI August 2026 feature summary","u":"https://community.fabric.microsoft.com/blog/fbc_pbiupdatesblog/power-bi-august-2026-feature-summary/5348434"},{"t":"Databricks release notes, September 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/september"}]}},{"id":"architecture","title":{"en":"Data Architects","nl":"Data Architects"},"en":{"paras":[{"t":"Data Architects. The catalog is turning into the control plane, and this week made that obvious. On Databricks, Iceberg version 3 is generally available in Unity Catalog, together with Managed Iceberg and Foreign Iceberg. One catalog now resolves metadata, controls access, vends credentials and sequences commits, for tables you own and tables you do not.","s":"Data Architects. The catalog is turning into the control plane, and this week made that obvious. On Databricks, Iceberg version three is generally available in Unity Catalog, together with Managed Iceberg and Foreign Iceberg. One catalog now resolves metadata, controls access, vends credentials and sequences commits, for tables you own and tables you do not."},{"t":"In the open source corner, Apache Polaris is working towards 1.8.0. The design debate is worth following. How much of a table's physical layout should the catalog get to decide? Your answer determines how portable your tables really are between engines.","s":"In the open source corner, Apache Polaris is working towards one point eight point zero. The design debate is worth following. How much of a table's physical layout should the catalog get to decide? Your answer determines how portable your tables really are between engines."},{"t":"On the enterprise side, SAP Business Data Cloud Connect for Snowflake is generally available. Zero copy sharing over Delta Sharing, no pipeline, the same onboarding as the Databricks connector. BigQuery, Fabric and Athena are next. If your client runs SAP, the question is no longer how to get the data out, but who governs the share.","s":"On the enterprise side, S A P Business Data Cloud Connect for Snowflake is generally available. Zero copy sharing over Delta Sharing, no pipeline, the same onboarding as the Databricks connector. BigQuery, Fabric and Athena are next. If your client runs S A P, the question is no longer how to get the data out, but who governs the share."}],"sources":[{"t":"Unity Catalog and the next era of Apache Iceberg","u":"https://www.databricks.com/blog/unity-catalog-and-next-era-apache-icebergtm"},{"t":"Apache Data Lakehouse Weekly, 26 August to 2 September 2026","u":"https://amdatalakehouse.substack.com/p/apache-data-lakehouse-weekly-august-ba2"},{"t":"SAP BDC Connect for Snowflake, general availability","u":"https://community.sap.com/t5/technology-blog-posts-by-sap/announcing-general-availability-of-sap-snowflake-and-sap-business-data/ba-p/14386550"}]},"nl":{"paras":[{"t":"Data Architects. De catalog wordt de control plane, en deze week maakte dat goed zichtbaar. Bij Databricks is Iceberg versie 3 algemeen beschikbaar in Unity Catalog, samen met Managed Iceberg en Foreign Iceberg. Eén catalog regelt dus metadata, toegang, credentials en de volgorde van commits, voor tabellen die van jou zijn en tabellen die dat niet zijn.","s":"Data Architects. De catalog wordt de control plane, en deze week maakte dat goed zichtbaar. Bij Databricks is Iceberg versie drie algemeen beschikbaar in Unity Catalog, samen met Managed Iceberg en Foreign Iceberg. Eén catalog regelt dus metadata, toegang, credentials en de volgorde van commits, voor tabellen die van jou zijn en tabellen die dat niet zijn."},{"t":"In de open source hoek werkt Apache Polaris toe naar 1.8.0. Het ontwerpdebat is de moeite waard. Hoeveel van de fysieke opzet van een tabel mag de catalog bepalen? Jouw antwoord bepaalt hoe overdraagbaar je tabellen echt zijn tussen engines.","s":"In de open source hoek werkt Apache Polaris toe naar een punt acht punt nul. Het ontwerpdebat is de moeite waard. Hoeveel van de fysieke opzet van een tabel mag de catalog bepalen? Jouw antwoord bepaalt hoe overdraagbaar je tabellen echt zijn tussen engines."},{"t":"Aan de enterprise kant is SAP Business Data Cloud Connect for Snowflake algemeen beschikbaar. Zero copy delen over Delta Sharing, geen pipeline, dezelfde onboarding als bij de Databricks connector. BigQuery, Fabric en Athena volgen. Draait je klant op SAP? Dan is de vraag niet meer hoe je het eruit haalt, maar wie de share bestuurt.","s":"Aan de enterprise kant is S A P Business Data Cloud Connect for Snowflake algemeen beschikbaar. Zero copy delen over Delta Sharing, geen pipeline, dezelfde onboarding als bij de Databricks connector. BigQuery, Fabric en Athena volgen. Draait je klant op S A P? Dan is de vraag niet meer hoe je het eruit haalt, maar wie de share bestuurt."}],"sources":[{"t":"Unity Catalog and the next era of Apache Iceberg","u":"https://www.databricks.com/blog/unity-catalog-and-next-era-apache-icebergtm"},{"t":"Apache Data Lakehouse Weekly, 26 August to 2 September 2026","u":"https://amdatalakehouse.substack.com/p/apache-data-lakehouse-weekly-august-ba2"},{"t":"SAP BDC Connect for Snowflake, general availability","u":"https://community.sap.com/t5/technology-blog-posts-by-sap/announcing-general-availability-of-sap-snowflake-and-sap-business-data/ba-p/14386550"}]}},{"id":"delivery","title":{"en":"Delivery Managers","nl":"Delivery Managers"},"en":{"paras":[{"t":"Delivery Managers. Microsoft published telemetry from tens of thousands of its own engineers during the early 2026 rollout of Claude Code and Copilot CLI. The headline is a 24 percent lift in merged pull requests. Read that carefully. It is a throughput number, not a return on investment number.","s":"Delivery Managers. Microsoft published telemetry from tens of thousands of its own engineers during the early twenty twenty six rollout of Claude Code and Copilot C L I. The headline is a twenty four percent lift in merged pull requests. Read that carefully. It is a throughput number, not a return on investment number."},{"t":"Gartner puts the net average productivity gain at 19.3 percent, with 90 percent of engineering leaders reporting some improvement. The counterweight sits in the same research. Speed at task level can hide rework, incidents and cognitive load that only surface weeks after the merge. On a fixed price deal, that lag is exactly where your margin goes.","s":"Gartner puts the net average productivity gain at nineteen point three percent, with ninety percent of engineering leaders reporting some improvement. The counterweight sits in the same research. Speed at task level can hide rework, incidents and cognitive load that only surface weeks after the merge. On a fixed price deal, that lag is exactly where your margin goes."},{"t":"Two practical moves. Put a token ceiling per workstream in the contract, because usage based pricing plus parallel background agents makes spend genuinely variable. And look at the AIM Agent from Snowflake, which since the fourth of September assesses SAS codebases with AI and converts SAS to Snowflake SQL. Estimating a migration just got cheaper, and that changes what you dare commit to.","s":"Two practical moves. Put a token ceiling per workstream in the contract, because usage based pricing plus parallel background agents makes spend genuinely variable. And look at the Aim Agent from Snowflake, which since the fourth of September assesses S A S codebases with A I and converts S A S to Snowflake S Q L. Estimating a migration just got cheaper, and that changes what you dare commit to."}],"sources":[{"t":"Microsoft AI coding agent study, the cost question","u":"https://larridin.com/blog/microsoft-study-ai-coding-agent-roi"},{"t":"Gartner, enterprise AI coding agent market","u":"https://www.gartner.com/en/articles/enterprise-ai-coding-agent-market"},{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"}]},"nl":{"paras":[{"t":"Delivery Managers. Microsoft publiceerde telemetrie van tienduizenden eigen engineers tijdens de uitrol van Claude Code en Copilot CLI begin 2026. De kop is 24 procent meer gemergede pull requests. Lees dat goed. Het is een doorvoergetal, geen rendement.","s":"Delivery Managers. Microsoft publiceerde telemetrie van tienduizenden eigen engineers tijdens de uitrol van Claude Code en Copilot C L I begin tweeduizend zesentwintig. De kop is vierentwintig procent meer gemergede pull requests. Lees dat goed. Het is een doorvoergetal, geen rendement."},{"t":"Gartner komt op gemiddeld 19,3 procent netto productiviteitswinst, waarbij 90 procent van de engineering leiders enige verbetering ziet. Het tegenwicht staat in hetzelfde onderzoek. Snelheid op taakniveau kan rework, incidenten en cognitieve belasting verbergen die pas weken na de merge opduiken. Bij een fixed price deal verdwijnt je marge precies daar.","s":"Gartner komt op gemiddeld negentien komma drie procent netto productiviteitswinst, waarbij negentig procent van de engineering leiders enige verbetering ziet. Het tegenwicht staat in hetzelfde onderzoek. Snelheid op taakniveau kan rework, incidenten en cognitieve belasting verbergen die pas weken na de merge opduiken. Bij een fixed price deal verdwijnt je marge precies daar."},{"t":"Twee praktische dingen. Zet een tokenplafond per workstream in het contract, want usage based pricing plus parallelle achtergrond agents maakt je verbruik echt grillig. En kijk naar de AIM Agent van Snowflake, die sinds 4 september SAS codebases met AI beoordeelt en SAS omzet naar Snowflake SQL. Een migratie inschatten wordt daardoor goedkoper, en dat verandert wat je durft toe te zeggen.","s":"Twee praktische dingen. Zet een tokenplafond per workstream in het contract, want usage based pricing plus parallelle achtergrond agents maakt je verbruik echt grillig. En kijk naar de Aim Agent van Snowflake, die sinds vier september S A S codebases met A I beoordeelt en S A S omzet naar Snowflake S Q L. Een migratie inschatten wordt daardoor goedkoper, en dat verandert wat je durft toe te zeggen."}],"sources":[{"t":"Microsoft AI coding agent study, the cost question","u":"https://larridin.com/blog/microsoft-study-ai-coding-agent-roi"},{"t":"Gartner, enterprise AI coding agent market","u":"https://www.gartner.com/en/articles/enterprise-ai-coding-agent-market"},{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"}]}},{"id":"outro","title":{"en":"Wrap up","nl":"Afsluiting"},"en":{"paras":[{"t":"That is your briefing, so pick one thing from your own block and do it before Wednesday. See you next Monday."}],"sources":[{"t":"Databricks release notes, September 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/september"},{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"}]},"nl":{"paras":[{"t":"Dat was je briefing, dus pak één ding uit je eigen blok en doe het voor woensdag. Tot volgende week maandag."}],"sources":[{"t":"Databricks release notes, September 2026","u":"https://docs.databricks.com/aws/en/release-notes/product/2026/september"},{"t":"Snowflake new features and release notes","u":"https://docs.snowflake.com/en/release-notes/new-features"}]}}]}]}

<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('data').textContent);
var ROLES = [
  {id:'generic',      nl:'Algemeen AI nieuws', en:'General AI news'},
  {id:'governance',   nl:'Data Governance',   en:'Data Governance'},
  {id:'engineering',  nl:'Data Engineers',    en:'Data Engineers'},
  {id:'bi',           nl:'BI Consultants',    en:'BI Consultants'},
  {id:'architecture', nl:'Data Architects',   en:'Data Architects'},
  {id:'delivery',     nl:'Delivery Managers', en:'Delivery Managers'}
];
var T = {
  nl:{pick:'Kies je onderwerpen', all:'Alles aan', none:'Alles uit', sources:'Bronnen',
      ready:'Klaar om af te spelen', playing:'Speelt af', paused:'Gepauzeerd', done:'Einde',
      generic:'Algemeen AI nieuws', outro:'Afsluiting', back:'terug', fwd:'vooruit', empty:'Kies minstens een onderwerp',
      count:function(n,m){return n+' van '+m+' onderdelen, ongeveer '+m2(n)+'';},
      hint:'Kies je functie, druk op Play en luister onderweg. Sla de app op je beginscherm op. <a href="archive.html">Alle edities</a>'},
  en:{pick:'Pick your topics', all:'Select all', none:'Clear all', sources:'Sources',
      ready:'Ready to play', playing:'Playing', paused:'Paused', done:'End',
      generic:'General AI news', outro:'Wrap up', back:'back', fwd:'forward', empty:'Pick at least one topic',
      count:function(n,m){return n+' of '+m+' blocks';},
      hint:'Pick your role, press Play and listen on the move. Add the app to your home screen. <a href="archive.html">All editions</a>'}
};
function m2(){return '';}

var lang = 'nl', edIdx = 0;
var selected = {};
ROLES.forEach(function(r){ selected[r.id] = true; });

try{
  var sl = localStorage.getItem('brief.lang'); if(sl==='nl'||sl==='en') lang = sl;
  var sr = localStorage.getItem('brief.roles');
  if(sr){ var arr = JSON.parse(sr); ROLES.forEach(function(r){ selected[r.id] = arr.indexOf(r.id) >= 0; }); }
}catch(e){}
function save(){ try{ localStorage.setItem('brief.lang',lang);
  localStorage.setItem('brief.roles', JSON.stringify(ROLES.filter(function(r){return selected[r.id];}).map(function(r){return r.id;}))); }catch(e){} }

var eds = DATA.briefings.slice().sort(function(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
function ed(){ return eds[edIdx]; }

function rank(id){ if(id==='outro') return 99;
  for(var i=0;i<ROLES.length;i++) if(ROLES[i].id===id) return i; return 50; }

function sectionsOf(e){
  if(e.sections && e.sections.length) return e.sections;
  return [{id:'generic', title:{en:'This week', nl:'Deze week'}, en:e.en, nl:e.nl}];
}
function secTitle(s){
  if(s.title && s.title[lang]) return s.title[lang];
  if(s.id==='generic') return T[lang].generic;
  if(s.id==='outro') return T[lang].outro;
  for(var i=0;i<ROLES.length;i++) if(ROLES[i].id===s.id) return ROLES[i][lang];
  return s.id;
}
function activeSections(){
  var all = sectionsOf(ed());
  var picked = all.filter(function(s){
    if(s.id==='outro') return false;
    if(rank(s.id)===50) return true;
    return !!selected[s.id];
  });
  if(!picked.length) return [];
  return picked.concat(all.filter(function(s){ return s.id==='outro'; }))
    .sort(function(a,b){ return rank(a.id)-rank(b.id); });
}

var Q = [], totalChars = 0, cps = 14.5, pos = 0;
var playing = false, paused = false, utter = null, gen = 0, tick = null, uStart = 0, uBase = 0;

function hardSplit(x){
  var out = [];
  while(x.length > 170){
    var cut = x.lastIndexOf(' ', 150);
    if(cut < 60) cut = 150;
    out.push(x.slice(0, cut));
    x = x.slice(cut).replace(/^\s+/, '');
  }
  if(x) out.push(x);
  return out;
}
function chunk(text){
  var parts = text.match(/[^.!?]+[.!?]+\s*|[^.!?]+$/g) || [text];
  var grouped = [], cur = '';
  parts.forEach(function(x){
    if(cur && (cur + x).length > 150){ grouped.push(cur); cur = x; } else { cur += x; }
  });
  if(cur) grouped.push(cur);
  var out = [];
  grouped.forEach(function(g){ hardSplit(g.trim()).forEach(function(h){ if(h.trim()) out.push(h.trim()); }); });
  return out.length ? out : [text];
}
function buildQueue(){
  Q = []; totalChars = 0;
  activeSections().forEach(function(s, si){
    var body = s[lang]; if(!body || !body.paras) return;
    body.paras.forEach(function(p, pi){
      var spoken = (p.s && p.s.length) ? p.s : p.t;
      chunk(spoken).forEach(function(c){
        Q.push({sec:si, secId:s.id, title:secTitle(s), t:p.t, text:c, gstart:totalChars, len:c.length, key:si+'_'+pi});
        totalChars += c.length + 1;
      });
    });
  });
}
function itemAt(p){
  for(var i=Q.length-1;i>=0;i--) if(p >= Q[i].gstart) return i;
  return 0;
}
function fmt(sec){ sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec/60), s = sec%60; return m+':'+(s<10?'0':'')+s; }

function render(){
  var host = document.getElementById('script'); host.innerHTML = '';
  activeSections().forEach(function(s, si){
    var body = s[lang]; if(!body || !body.paras) return;
    var h = document.createElement('h3'); h.textContent = secTitle(s); host.appendChild(h);
    body.paras.forEach(function(p, pi){
      var el = document.createElement('p'); el.textContent = p.t; el.id = 'p_'+si+'_'+pi; host.appendChild(el);
    });
    if(body.sources && body.sources.length){
      var d = document.createElement('div'); d.className = 'sources';
      d.innerHTML = '<strong>'+T[lang].sources+'</strong><br>' + body.sources.map(function(x){
        return '<a href="'+x.u+'" target="_blank" rel="noopener">'+x.t+'</a>'; }).join('<br>');
      host.appendChild(d);
    }
  });
}
function highlight(){
  var cur = Q.length ? Q[itemAt(pos)] : null;
  var all = document.querySelectorAll('#script p');
  for(var i=0;i<all.length;i++) all[i].classList.remove('speaking');
  if(cur && playing){ var el = document.getElementById('p_'+cur.key); if(el) el.classList.add('speaking'); }
}
function paint(){
  var pct = totalChars ? Math.min(100, (pos/totalChars)*100) : 0;
  document.getElementById('progbar').style.width = pct + '%';
  document.getElementById('tcur').textContent = fmt(pos/cps);
  document.getElementById('ttot').textContent = fmt(totalChars/cps);
  var st = document.getElementById('status');
  if(playing && !paused) st.textContent = T[lang].playing + ' · ' + (Q.length ? Q[itemAt(pos)].title : '');
  else if(paused) st.textContent = T[lang].paused;
  else if(!Q.length) st.textContent = T[lang].empty;
  else st.textContent = T[lang].ready + ' · ' + fmt(totalChars/cps);
  highlight();
}

function pickVoice(){
  var vs = window.speechSynthesis.getVoices() || [];
  var want = lang === 'nl' ? 'nl' : 'en';
  var v = vs.filter(function(x){ return (x.lang||'').toLowerCase().indexOf(want) === 0; });
  if(!v.length) return null;
  var local = v.filter(function(x){ return x.localService; });
  return (local[0] || v[0]);
}
function speakFrom(p){
  if(!Q.length) return;
  var myGen = ++gen;
  var busy = window.speechSynthesis.speaking || window.speechSynthesis.pending;
  window.speechSynthesis.cancel();
  pos = Math.max(0, Math.min(p, totalChars - 1));
  var i = itemAt(pos);
  var local = Math.max(0, Math.floor(pos - Q[i].gstart));
  if(local >= Q[i].len){ local = 0; }
  if(local > 0){ var sp = Q[i].text.lastIndexOf(' ', local); local = sp > 0 ? sp + 1 : 0; }
  pos = Q[i].gstart + local;
  var u = new SpeechSynthesisUtterance(Q[i].text.slice(local));
  u.lang = lang === 'nl' ? 'nl-NL' : 'en-GB';
  var v = pickVoice(); if(v) u.voice = v;
  u.rate = 1; u.pitch = 1;
  uStart = Date.now(); uBase = pos;
  u.onstart = function(){ if(myGen !== gen) return; uStart = Date.now(); uBase = pos; };
  u.onboundary = function(e){
    if(myGen !== gen) return;
    if(typeof e.charIndex !== 'number') return;
    pos = Q[i].gstart + local + e.charIndex;
    var el = (Date.now() - uStart) / 1000;
    if(el > 2 && e.charIndex > 20){
      var r = e.charIndex / el;
      if(r > 5 && r < 35) cps = cps * 0.85 + r * 0.15;
    }
  };
  u.onend = function(){
    if(myGen !== gen) return;
    if(i + 1 < Q.length){ speakFrom(Q[i+1].gstart); }
    else { stop(true); document.getElementById('status').textContent = T[lang].done; }
  };
  u.onerror = function(){ if(myGen !== gen) return; stop(true); };
  utter = u;
  playing = true; paused = false;
  if(busy){ setTimeout(function(){ if(myGen === gen) window.speechSynthesis.speak(u); }, 90); }
  else { window.speechSynthesis.speak(u); }
  startTick(); paint(); buttons();
}
function startTick(){
  if(tick) return;
  var n = 0;
  tick = setInterval(function(){
    if(playing && !paused){
      n++;
      if(n % 25 === 0){ try{ window.speechSynthesis.resume(); }catch(e){} }
      var expect = uBase + ((Date.now() - uStart) / 1000) * cps;
      if(expect > pos) pos = Math.min(expect, totalChars - 1);
      paint();
    }
  }, 300);
}
function stopTick(){ if(tick){ clearInterval(tick); tick = null; } }
function play(){
  if(paused && window.speechSynthesis.paused){ window.speechSynthesis.resume(); paused = false; buttons(); paint(); return; }
  if(playing) return;
  speakFrom(pos >= totalChars - 1 ? 0 : pos);
}
function pause(){
  if(!playing || paused) return;
  window.speechSynthesis.pause(); paused = true; buttons(); paint();
}
function stop(soft){
  gen++; window.speechSynthesis.cancel();
  playing = false; paused = false; stopTick();
  if(!soft) pos = 0;
  buttons(); paint();
}
function seek(sec){
  var np = pos + sec * cps;
  if(np < 0) np = 0;
  if(np >= totalChars - 1){ stop(false); return; }
  if(playing){ speakFrom(np); }
  else { pos = np; paint(); }
}
function buttons(){
  document.getElementById('play').innerHTML = (playing && !paused) ? '&#9654; Play' : '&#9654; Play';
  document.getElementById('pause').disabled = !playing || paused;
  document.getElementById('stop').disabled = !playing && pos === 0;
}

function chips(){
  var host = document.getElementById('chips'); host.innerHTML = '';
  var ids = {}; sectionsOf(ed()).forEach(function(s){ ids[s.id] = true; });
  ROLES.forEach(function(r){
    if(!ids[r.id]) return;
    var c = document.createElement('span');
    c.className = 'chip' + (selected[r.id] ? ' on' : '');
    c.innerHTML = '<span class="dot"></span>' + r[lang];
    c.onclick = function(){ selected[r.id] = !selected[r.id]; save(); refresh(); };
    host.appendChild(c);
  });
  var n = ROLES.filter(function(r){ return ids[r.id] && selected[r.id]; }).length;
  var m = ROLES.filter(function(r){ return ids[r.id]; }).length;
  document.getElementById('pickCount').textContent = m ? (n + ' / ' + m) : '';
  var b = document.getElementById('pickAll');
  b.textContent = (n === m && m > 0) ? T[lang].none : T[lang].all;
  b.onclick = function(){ var on = !(n === m && m > 0); ROLES.forEach(function(r){ selected[r.id] = on; }); save(); refresh(); };
  document.getElementById('pickTitle').textContent = T[lang].pick;
  document.getElementById('back10').innerHTML = '&#8630; 10<small>' + T[lang].back + '</small>';
  document.getElementById('fwd10').innerHTML = '10 &#8631;<small>' + T[lang].fwd + '</small>';
  document.getElementById('hint').innerHTML = T[lang].hint;
}
function editions(){
  var s = document.getElementById('edition'); s.innerHTML = '';
  eds.forEach(function(e, i){
    var o = document.createElement('option'); o.value = i;
    o.textContent = e.label[lang] + ' · ' + (e.summary ? e.summary[lang] : '');
    s.appendChild(o);
  });
  s.value = edIdx;
}
function refresh(){
  stop(false);
  document.getElementById('weekstamp').textContent = ed().label[lang];
  document.getElementById('nl').className = lang === 'nl' ? 'on' : '';
  document.getElementById('en').className = lang === 'en' ? 'on' : '';
  chips(); editions(); buildQueue(); render(); pos = 0; paint(); buttons();
}

document.getElementById('nl').onclick = function(){ lang = 'nl'; save(); refresh(); };
document.getElementById('en').onclick = function(){ lang = 'en'; save(); refresh(); };
document.getElementById('edition').onchange = function(){ edIdx = parseInt(this.value, 10) || 0; refresh(); };
document.getElementById('play').onclick = play;
document.getElementById('pause').onclick = pause;
document.getElementById('stop').onclick = function(){ stop(false); };
document.getElementById('back10').onclick = function(){ seek(-10); };
document.getElementById('fwd10').onclick = function(){ seek(10); };
document.getElementById('prog').onclick = function(e){
  var r = this.getBoundingClientRect();
  var f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  var np = f * totalChars;
  if(playing){ speakFrom(np); } else { pos = np; paint(); }
};
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowLeft'){ seek(-10); } else if(e.key === 'ArrowRight'){ seek(10); }
  else if(e.code === 'Space'){ e.preventDefault(); if(playing && !paused) pause(); else play(); }
});
if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged = function(){};
window.addEventListener('beforeunload', function(){ try{ window.speechSynthesis.cancel(); }catch(e){} });
refresh();
})();
</script>
</body></html>
